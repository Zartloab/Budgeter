<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinOS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070F;color:#F0F0FF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#app{max-width:520px;margin:auto;padding:12px}.card{background:#0F0F1A;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px;margin:10px 0}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;position:sticky;top:0;background:#07070F;padding-bottom:8px}.nav button{border:1px solid rgba(255,255,255,.1);background:#161626;color:#bbb;border-radius:8px;padding:8px 4px;font-size:11px}.nav button.active{color:#fff;border-color:#54A0FF}.inp,textarea,select{width:100%;background:#161626;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px;margin:4px 0}table{width:100%;font-size:12px;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid rgba(255,255,255,.08)}.btn{background:#54A0FF;border:0;border-radius:8px;padding:8px 10px;color:#001;font-weight:700;cursor:pointer}.muted{color:#8e8eb0;font-size:12px}
</style>
</head>
<body><div id="app"></div>
<script>
const CFG_KEY='finos_cfg_v3', DATA_KEY='finos_data_v3';
const defaultBuckets=[
['Rent','🏠','#74B9FF',1,'fixed',700],['Bills','⚡','#A29BFE',2,'fixed',180],['Groceries','🛒','#54A0FF',3,'fixed',150],['Spending','💳','#FDCB6E',9,'flexible',120],['Emergency Fund','🛟','#55EFC4',4,'goal',80],['Debt Repayment','💸','#FD79A8',5,'debt',120],['Savings','💰','#00CEC9',6,'savings',90],['Goals / Trips','✈️','#FF9F43',8,'goal',70],['Subscriptions','📱','#6C5CE7',7,'fixed',40],['Leftover / Buffer','🧱','#B2BEC3',99,'buffer',0]
].map(([name,emoji,color,priority,type,weeklyAmount])=>({id:crypto.randomUUID(),name,emoji,color,weeklyAmount,priority,type,targetAmount:null,currentBalance:0,rollover:type!=='flexible',active:true}));
const CFG0={currency:'AUD',claudeApiKey:'',emergencyTarget:2000,totalDebt:40500,buckets:defaultBuckets};
const DATA0={weeklyEntries:[],transactions:[],aiHistory:[]};
let cfg=load(CFG_KEY,CFG0),data=load(DATA_KEY,DATA0),tab='log';
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v?{...d,...v}:structuredClone(d)}catch{return structuredClone(d)}}
function save(){localStorage.setItem(CFG_KEY,JSON.stringify(cfg));localStorage.setItem(DATA_KEY,JSON.stringify(data));}
function money(n){return new Intl.NumberFormat('en-AU',{style:'currency',currency:cfg.currency}).format(n||0)}
function allocateIncome(incomeAmount,buckets){const active=buckets.filter(b=>b.active).sort((a,b)=>a.priority-b.priority);const plannedBuckets=active.filter(b=>b.type!=='buffer' && b.name!=='Leftover / Buffer');let remaining=Number(incomeAmount)||0;const allocations=[];const plannedTotal=plannedBuckets.reduce((s,b)=>s+(+b.weeklyAmount||0),0);for(const b of plannedBuckets){const p=+b.weeklyAmount||0;let a=0,status='skipped';if(remaining>=p){a=p;status='funded'}else if(remaining>0){a=remaining;status='partial'}remaining=Math.max(0,remaining-a);allocations.push({bucketId:b.id,bucketName:b.name,plannedAmount:p,allocatedAmount:a,status});}const allocatedTotal=allocations.reduce((s,x)=>s+x.allocatedAmount,0);const leftover=Math.max(0,remaining);const shortfall=Math.max(0,plannedTotal-(Number(incomeAmount)||0));return {plannedTotal,allocatedTotal,leftover,shortfall,allocations};}
function render(){const app=document.getElementById('app');const last=data.weeklyEntries[0];app.innerHTML=`<div class='nav'>${['dashboard','log','plan','history','ai','settings'].map(t=>`<button class='${tab===t?'active':''}' onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${view()}`;}
function view(){if(tab==='log')return logView();if(tab==='plan')return planView();if(tab==='history')return historyView();if(tab==='ai')return aiView();if(tab==='settings')return settingsView();return dashView();}
function dashView(){const l=data.weeklyEntries[0];const eBal=(cfg.buckets.find(b=>b.name==='Emergency Fund')||{}).currentBalance||0;const dBal=(cfg.buckets.find(b=>b.name==='Debt Repayment')||{}).currentBalance||0;return `<div class='card'><h3>Dashboard</h3><div class='muted'>Primary flow: weekly income delegation.</div>${l?`<p>This Week: ${money(l.incomeAmount)} | Allocated: ${money(l.allocatedTotal)} | Leftover: ${money(l.leftover)} | Shortfall: ${money(l.shortfall)}</p>`:'<p>No weekly entries yet.</p>'}</div><div class='card'><h4>Bucket Balances</h4>${cfg.buckets.map(b=>`<div>${b.emoji} ${b.name}: ${money(b.currentBalance)}</div>`).join('')}</div><div class='card'><p>Emergency Progress: ${money(eBal)} / ${money(cfg.emergencyTarget)}</p><p>Debt Progress: ${money(dBal)} / ${money(cfg.totalDebt)}</p></div>`;}
function logView(){return `<div class='card'><h3>Log Income (Primary)</h3><input id='income' class='inp' type='number' placeholder='Weekly salary/income'/><textarea id='notes' placeholder='Optional notes'></textarea><button class='btn' onclick='previewAllocation()'>Preview Allocation</button><div id='preview'></div></div>`;}
window.previewAllocation=function(){const income=+document.getElementById('income').value||0;const notes=document.getElementById('notes').value||'';const p=allocateIncome(income,cfg.buckets);document.getElementById('preview').innerHTML=`<table><tr><th>Bucket</th><th>Planned</th><th>Allocated</th><th>Status</th></tr>${p.allocations.map(a=>`<tr><td>${a.bucketName}</td><td>${money(a.plannedAmount)}</td><td>${money(a.allocatedAmount)}</td><td>${a.status}</td></tr>`).join('')}</table><p>Leftover / Buffer: ${money(p.leftover)} | Shortfall: ${money(p.shortfall)}</p><button class='btn' onclick='confirmWeek(${income},${JSON.stringify(notes).replace(/"/g,'&quot;')})'>Confirm Week</button>`;window.__preview={income,notes,p};}
window.confirmWeek=function(){const o=window.__preview;if(!o)return;const entry={id:crypto.randomUUID(),date:new Date().toISOString(),incomeAmount:o.income,plannedTotal:o.p.plannedTotal,allocatedTotal:o.p.allocatedTotal,leftover:o.p.leftover,shortfall:o.p.shortfall,allocations:o.p.allocations,notes:o.notes,aiSummary:''};data.weeklyEntries.unshift(entry);for(const a of o.p.allocations){const b=cfg.buckets.find(x=>x.id===a.bucketId);if(!b)continue;if(b.rollover||['debt','savings','goal','buffer'].includes(b.type))b.currentBalance=(+b.currentBalance||0)+a.allocatedAmount;}const buffer=cfg.buckets.find(b=>b.type==='buffer'||b.name==='Leftover / Buffer');if(buffer&&buffer.rollover&&o.p.leftover>0)buffer.currentBalance=(+buffer.currentBalance||0)+o.p.leftover;save();alert('Week saved. You can now run AI review.');render();}
function planView(){return `<div class='card'><h3>Money Plan</h3>${cfg.buckets.map((b,i)=>`<div><input class='inp' value='${b.name}' onchange='updBucket(${i},"name",this.value)'/><input class='inp' type='number' value='${b.weeklyAmount}' onchange='updBucket(${i},"weeklyAmount",+this.value)'/><select class='inp' onchange='updBucket(${i},"type",this.value)'>${['fixed','flexible','goal','debt','savings','buffer'].map(t=>`<option ${b.type===t?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}<button class='btn' onclick='addBucket()'>Add Bucket</button></div>`;}
window.updBucket=(i,k,v)=>{cfg.buckets[i][k]=v;save();};window.addBucket=()=>{cfg.buckets.push({id:crypto.randomUUID(),name:'New Bucket',emoji:'📦',color:'#888',weeklyAmount:0,priority:10,type:'flexible',targetAmount:null,currentBalance:0,rollover:false,active:true});save();render();}
function historyView(){return `<div class='card'><h3>History</h3><button class='btn' onclick='expWeeklyCSV()'>Export Weekly CSV</button>${data.weeklyEntries.map(e=>`<details><summary>${new Date(e.date).toLocaleDateString()} - ${money(e.incomeAmount)}</summary>${e.allocations.map(a=>`<div>${a.bucketName}: ${money(a.allocatedAmount)} (${a.status})</div>`).join('')}</details>`).join('')}</div>`;}
function aiView(){return `<div class='card'><h3>AI Coach</h3><textarea id='aiq' placeholder='Ask My Money...'></textarea><button class='btn' onclick='askAI()'>Send</button><button class='btn' onclick='weeklyReview()'>Generate Weekly Review</button><div id='aires' class='muted'></div></div>`;}
async function callClaude(prompt){const res=await window.finosAPI.claudeMessage({apiKey:cfg.claudeApiKey,system:'You are FinOS AI coach for weekly income delegation.',messages:[{role:'user',content:prompt}]});if(!res.ok)throw new Error(res.error);data.aiHistory.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),prompt,response:res.text});save();return res.text;}
window.askAI=async()=>{try{document.getElementById('aires').textContent=await callClaude(document.getElementById('aiq').value||'How am I tracking against my plan?');}catch(e){document.getElementById('aires').textContent=e.message;}};
window.weeklyReview=async()=>{const w=data.weeklyEntries[0];if(!w)return;const prompt=`Weekly Review: income ${w.incomeAmount}, shortfall ${w.shortfall}, leftover ${w.leftover}, allocations ${JSON.stringify(w.allocations)}. Give: what went well, what is tight, next week improvements, leftover suggestion, shortfall fix.`;try{const t=await callClaude(prompt);w.aiSummary=t;save();document.getElementById('aires').textContent=t;}catch(e){document.getElementById('aires').textContent=e.message;}};
function settingsView(){return `<div class='card'><h3>Settings</h3><label>Claude API Key</label><input class='inp' id='k' value='${cfg.claudeApiKey||''}'/><label>Currency</label><input class='inp' id='c' value='${cfg.currency}'/><button class='btn' onclick='saveSettings()'>Save</button><button class='btn' onclick='expBackup()'>Export Backup JSON</button><input type='file' id='imp' onchange='impBackup(event)'/><button class='btn' onclick='expPlanCSV()'>Export Bucket Plan CSV</button><button class='btn' onclick='resetData()'>Reset Data</button><div id='appInfo' class='muted'></div></div>`;}
window.saveSettings=()=>{cfg.claudeApiKey=document.getElementById('k').value.trim();cfg.currency=document.getElementById('c').value.trim().toUpperCase()||'AUD';save();render();};
function dl(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();}
window.expBackup=()=>dl('finos-backup.json',JSON.stringify({cfg,data},null,2),'application/json');window.impBackup=async(e)=>{const f=e.target.files[0];if(!f)return;const j=JSON.parse(await f.text());cfg=j.cfg;data=j.data;save();render();};
window.expWeeklyCSV=()=>{const rows=['date,income,planned,allocated,leftover,shortfall,notes'];data.weeklyEntries.forEach(w=>rows.push([w.date,w.incomeAmount,w.plannedTotal,w.allocatedTotal,w.leftover,w.shortfall,JSON.stringify(w.notes||'')].join(',')));dl('weekly-entries.csv',rows.join('\n'),'text/csv');};
window.expPlanCSV=()=>{const rows=['name,type,priority,weeklyAmount,currentBalance,active,rollover'];cfg.buckets.forEach(b=>rows.push([b.name,b.type,b.priority,b.weeklyAmount,b.currentBalance,b.active,b.rollover].join(',')));dl('bucket-plan.csv',rows.join('\n'),'text/csv');};
window.resetData=()=>{if(confirm('Reset all local data?')){cfg=structuredClone(CFG0);data=structuredClone(DATA0);save();render();}};
(async()=>{try{const info=await window.finosAPI.appInfo();setTimeout(()=>{const el=document.getElementById('appInfo');if(el)el.textContent=`${info.name} v${info.version} (${info.platform})`;},50);}catch{}})();
render();
</script></body></html>

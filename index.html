<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinOS</title>
<style>
:root{--bg:#06070b;--panel:#0f1117;--panel2:#151924;--line:rgba(255,255,255,.10);--text:#f7f9ff;--muted:#9ea8be;--violet:#494fdf;--ok:#00a87e;--warn:#ec7e00;--bad:#e23b4a}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(1200px 700px at 25% -10%,#23285f 0%,#06070b 45%),#06070b;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
.app-shell{max-width:1180px;margin:0 auto;padding:18px;display:grid;grid-template-columns:240px 1fr;gap:14px;min-height:100vh}
.sidebar,.main{background:var(--panel);border:1px solid var(--line);border-radius:22px}.sidebar{padding:18px;display:flex;flex-direction:column;gap:12px}.brand{font-size:28px;font-weight:700;letter-spacing:-.02em}.sub{color:var(--muted);font-size:13px}
.nav button{width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--muted);padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:600}.nav button.active{color:#fff;background:rgba(73,79,223,.22);border-color:rgba(73,79,223,.55)}
.main{padding:18px;display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:end}.h1{font-size:34px;font-weight:700;letter-spacing:-.02em}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--panel2),#10131b);border:1px solid var(--line);border-radius:18px;padding:14px}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}.num{font-size:30px;font-weight:700;letter-spacing:-.02em}.small{font-size:13px;color:var(--muted)}
.bucket{border:1px solid var(--line);border-radius:14px;background:#0b0e15;padding:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:9999px;color:#dbe3ff}.progress{height:7px;background:rgba(255,255,255,.08);border-radius:9999px;overflow:hidden}.bar{height:100%;background:var(--violet)}
.inp,textarea,select{width:100%;border:1px solid #d8dee8;background:#fff;color:#151922;border-radius:12px;padding:12px 13px;font-size:15px}.btn{border:0;border-radius:9999px;height:46px;padding:0 16px;font-weight:700;cursor:pointer}.btn-main{background:#fff;color:#000}.btn-v{background:var(--violet);color:#fff}
.stack>*{margin-bottom:10px}.stack>*:last-child{margin-bottom:0}.s-funded{border-color:rgba(0,168,126,.85)}.s-partial{border-color:rgba(236,126,0,.9)}.s-skipped{border-color:rgba(226,59,74,.9)}
@media (max-width:980px){.app-shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:2}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.nav button{text-align:center}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const CFG_KEY='finos_cfg_v3',DATA_KEY='finos_data_v3';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),clone=v=>JSON.parse(JSON.stringify(v)),safeNum=v=>Number.isFinite(Number(v))?Number(v):0,esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const defaultBuckets=[['Rent','🏠','#74B9FF',1,'fixed',700],['Bills','⚡','#A29BFE',2,'fixed',180],['Groceries','🛒','#54A0FF',3,'fixed',150],['Spending','💳','#FDCB6E',9,'flexible',120],['Emergency Fund','🛟','#55EFC4',4,'goal',80],['Debt Repayment','💸','#FD79A8',5,'debt',120],['Savings','💰','#00CEC9',6,'savings',90],['Goals / Trips','✈️','#FF9F43',8,'goal',70],['Subscriptions','📱','#6C5CE7',7,'fixed',40],['Leftover / Buffer','🧱','#B2BEC3',99,'buffer',0]].map(([name,emoji,color,priority,type,weeklyAmount])=>({id:uid(),name,emoji,color,weeklyAmount,priority,type,targetAmount:null,currentBalance:0,rollover:type!=='flexible',active:true}));
const CFG0={currency:'AUD',aiProvider:'openai',openaiApiKey:'',claudeApiKey:'',openaiModel:'gpt-5.2',claudeModel:'claude-sonnet-4-20250514',emergencyTarget:2000,totalDebt:40500,buckets:defaultBuckets};
const DATA0={weeklyEntries:[],transactions:[],aiHistory:[]};
const loadSafe=(k,d)=>{try{const r=localStorage.getItem(k);if(!r)return clone(d);const p=JSON.parse(r);const m={...clone(d),...p};if(!Array.isArray(m.buckets))m.buckets=clone(d.buckets);if(!Array.isArray(m.weeklyEntries))m.weeklyEntries=[];if(!Array.isArray(m.transactions))m.transactions=[];if(!Array.isArray(m.aiHistory))m.aiHistory=[];return m}catch{return clone(d)}};
let cfg=loadSafe(CFG_KEY,CFG0),data=loadSafe(DATA_KEY,DATA0),tab='dashboard',previewState=null,aiBusy=false,aiSetupMsg='';
const saveSafe=()=>{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));localStorage.setItem(DATA_KEY,JSON.stringify(data));},hasOpenAIKey=()=>!!(cfg.openaiApiKey||'').trim(),money=n=>{try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:cfg.currency||'AUD'}).format(safeNum(n))}catch{return '$'+safeNum(n).toFixed(2)}};
function allocateIncome(incomeAmount,buckets){const income=Math.max(0,safeNum(incomeAmount));const active=buckets.filter(b=>b&&b.active!==false).sort((a,b)=>safeNum(a.priority)-safeNum(b.priority));const plannedBuckets=active.filter(b=>b.type!=='buffer'&&b.name!=='Leftover / Buffer');let remaining=income;const allocations=[];const plannedTotal=plannedBuckets.reduce((s,b)=>s+Math.max(0,safeNum(b.weeklyAmount)),0);for(const b of plannedBuckets){const plannedAmount=Math.max(0,safeNum(b.weeklyAmount));let allocatedAmount=0,status='skipped';if(remaining>=plannedAmount){allocatedAmount=plannedAmount;status='funded';}else if(remaining>0){allocatedAmount=remaining;status='partial'}remaining=Math.max(0,remaining-allocatedAmount);allocations.push({bucketId:b.id,bucketName:b.name,plannedAmount,allocatedAmount,status})}const allocatedTotal=allocations.reduce((s,a)=>s+safeNum(a.allocatedAmount),0);return{plannedTotal,allocatedTotal,leftover:Math.max(0,remaining),shortfall:Math.max(0,plannedTotal-income),allocations}}
const TABS=[['dashboard','Overview'],['log','Log Income'],['plan','Money Plan'],['history','History'],['ai','AI Coach'],['settings','Settings']];
function render(){app.innerHTML=`<div class='app-shell'><aside class='sidebar'><div><div class='brand'>FinOS</div><div class='sub'>Weekly Delegation OS</div></div><nav class='nav'>${TABS.map(([k,l])=>`<button class='${tab===k?'active':''}' data-tab='${k}'>${l}</button>`).join('')}</nav><div class='sub'>Local-first desktop app</div></aside><main class='main'>${view()}</main></div>`;bind()}
function view(){if(tab==='log')return logView();if(tab==='plan')return planView();if(tab==='history')return historyView();if(tab==='ai')return aiView();if(tab==='settings')return settingsView();return dashboardView()}
function dashboardView(){const w=data.weeklyEntries[0];const e=(cfg.buckets.find(b=>b.name==='Emergency Fund')||{}).currentBalance||0;const d=(cfg.buckets.find(b=>b.name==='Debt Repayment')||{}).currentBalance||0;return `<section class='top'><div><div class='h1'>Dashboard</div><div class='small'>Clear weekly money picture</div></div></section><section class='grid3'><div class='card'><div class='label'>Income</div><div class='num'>${money(w?.incomeAmount||0)}</div></div><div class='card'><div class='label'>Allocated</div><div class='num'>${money(w?.allocatedTotal||0)}</div></div><div class='card'><div class='label'>Leftover / Buffer</div><div class='num' style='color:var(--ok)'>${money(w?.leftover||0)}</div></div></section><section class='card'><div class='label'>Bucket Balances</div><div class='grid2'>${cfg.buckets.map(b=>`<div class='bucket'><div class='row'><span>${esc(b.emoji)} <b>${esc(b.name)}</b></span><span class='pill'>${esc(b.type)}</span></div><div><b>${money(b.currentBalance)}</b></div><div class='small'>Weekly ${money(b.weeklyAmount)}</div>${b.targetAmount?`<div class='progress'><div class='bar' style='width:${Math.min(100,Math.round((safeNum(b.currentBalance)/safeNum(b.targetAmount))*100))}%'></div></div>`:''}</div>`).join('')}</div></section><section class='grid2'><div class='card'><div class='label'>Emergency progress</div><div><b>${money(e)}</b> / ${money(cfg.emergencyTarget)}</div></div><div class='card'><div class='label'>Debt progress</div><div><b>${money(d)}</b> / ${money(cfg.totalDebt)}</div></div></section>`}
function logView(){return `<section class='top'><div><div class='h1'>Log Income</div><div class='small'>Primary weekly flow</div></div></section><section class='card stack'><label class='label'>Income amount</label><input id='income' class='inp' type='number' placeholder='Enter weekly income'/><label class='label'>Notes</label><textarea id='notes' class='inp' style='height:90px' placeholder='Optional context'></textarea><button class='btn btn-v' id='previewBtn'>Preview Allocation</button></section>${previewState?`<section class='card'><div class='label'>Allocation Preview</div><div class='stack'>${previewState.allocations.map(a=>`<div class='bucket s-${a.status}'><div class='row'><b>${esc(a.bucketName)}</b><span class='pill'>${a.status}</span></div><div class='small'>Planned ${money(a.plannedAmount)} · Allocated ${money(a.allocatedAmount)}</div></div>`).join('')}</div><div class='row' style='margin-top:8px'><span>Leftover</span><b style='color:var(--ok)'>${money(previewState.leftover)}</b></div><div class='row'><span>Shortfall</span><b style='color:var(--warn)'>${money(previewState.shortfall)}</b></div><button class='btn btn-main' id='confirmBtn' style='margin-top:10px'>Confirm Week</button></section>`:''}`}
function planView(){return `<section class='top'><div><div class='h1'>Money Plan</div><div class='small'>Edit your delegation buckets</div></div></section><section class='card'><div class='stack'>${cfg.buckets.map((b,i)=>`<div class='bucket'><div class='row'><span>${esc(b.emoji)} <b>${esc(b.name)}</b></span><span class='pill'>P${safeNum(b.priority)}</span></div><div class='row'><span class='pill'>${esc(b.type)}</span><span class='small'>${b.active!==false?'Active':'Inactive'}</span></div><div class='grid2'><input class='inp' data-b='${i}' data-k='weeklyAmount' type='number' value='${safeNum(b.weeklyAmount)}'/><input class='inp' data-b='${i}' data-k='priority' type='number' value='${safeNum(b.priority)}'/></div></div>`).join('')}</div><button class='btn btn-v' id='addBucketBtn' style='margin-top:10px'>Add Bucket</button></section>`}
function historyView(){return `<section class='top'><div><div class='h1'>History</div><div class='small'>Past weekly entries</div></div><button class='btn btn-main' id='weeklyCsvBtn'>Export CSV</button></section><section class='card stack'>${data.weeklyEntries.length?data.weeklyEntries.map(e=>`<details class='bucket'><summary><b>${new Date(e.date).toLocaleDateString()}</b> · ${money(e.incomeAmount)}</summary><div class='small'>Allocated ${money(e.allocatedTotal)} · Leftover ${money(e.leftover)} · Shortfall ${money(e.shortfall)}</div>${(e.allocations||[]).map(a=>`<div class='small'>${esc(a.bucketName)} — ${money(a.allocatedAmount)} (${a.status})</div>`).join('')}</details>`).join(''):`<div class='small'>No weekly entries yet.</div>`}</section>`}
function aiView(){const need=!hasOpenAIKey();const provider=cfg.aiProvider==='claude'?'Claude':'OpenAI';const model=cfg.aiProvider==='claude'?(cfg.claudeModel||'claude-sonnet-4-20250514'):(cfg.openaiModel||'gpt-5.2');return `<section class='top'><div><div class='h1'>AI Coach</div><div class='small'>Using ${provider} ${esc(model)}</div></div></section><section class='card stack'>${need?`<div class='small'>Setup required: add OpenAI key in Settings.</div>`:''}<textarea id='aiq' class='inp' style='height:100px' ${need?'disabled':''} placeholder='Ask: Where should my leftover go?'></textarea><div class='row'><button class='btn btn-v' id='aiSend' ${need?'disabled':''}>${aiBusy?'Loading...':'Send'}</button><button class='btn btn-main' id='aiWeek' ${(need||!data.weeklyEntries.length)?'disabled':''}>Generate Weekly Review</button></div><div id='aires' class='small'>${need?'AI disabled until setup.':'AI response will appear here.'}</div></section>`}
function settingsView(){return `<section class='top'><div><div class='h1'>Settings</div><div class='small'>Provider, keys, backup & reset</div></div></section><section class='card stack'><label class='label'>AI Provider</label><select id='aiProvider' class='inp'><option value='openai' ${cfg.aiProvider==='openai'?'selected':''}>OpenAI</option><option value='claude' ${cfg.aiProvider==='claude'?'selected':''}>Claude</option></select><label class='label'>OpenAI API key</label><input id='openaiKey' class='inp' value='${esc(cfg.openaiApiKey||'')}' placeholder='sk-...'/><div class='small'>Your API key is stored only on this device. It is not uploaded anywhere except when making requests to OpenAI.</div><button class='btn btn-main' id='testOpenAIKeyBtn'>Test OpenAI Key</button><div id='openaiTestResult' class='small'>${esc(aiSetupMsg||'')}</div><label class='label'>Claude API key</label><input id='claudeKey' class='inp' value='${esc(cfg.claudeApiKey||'')}'/><div class='grid2'><div><label class='label'>OpenAI model</label><input id='openaiModel' class='inp' value='${esc(cfg.openaiModel||'gpt-5.2')}'/></div><div><label class='label'>Claude model</label><input id='claudeModel' class='inp' value='${esc(cfg.claudeModel||'claude-sonnet-4-20250514')}'/></div></div><label class='label'>Currency</label><input id='c' class='inp' value='${esc(cfg.currency||'AUD')}'/><button class='btn btn-v' id='saveSettingsBtn'>Save Settings</button></section><section class='card stack'><div class='label'>Data Tools</div><button class='btn btn-main' id='backupBtn'>Export Backup JSON</button><input type='file' id='imp'/><button class='btn btn-main' id='planCsvBtn'>Export Bucket Plan CSV</button><button class='btn btn-main' id='weeklyCsvBtn'>Export Weekly CSV</button></section><section class='card stack'><div class='label'>Danger Zone</div><button class='btn btn-main' id='resetBtn'>Reset Data</button><div id='appInfo' class='small'>Loading app info...</div></section>`}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const p=document.getElementById('previewBtn');if(p)p.onclick=()=>{const income=safeNum(document.getElementById('income').value);previewState={income,notes:document.getElementById('notes').value||'',...allocateIncome(income,cfg.buckets)};render()};const c=document.getElementById('confirmBtn');if(c)c.onclick=confirmWeek;document.querySelectorAll('[data-b]').forEach(el=>el.onchange=e=>{const i=Number(e.target.dataset.b),k=e.target.dataset.k;if(cfg.buckets[i])cfg.buckets[i][k]=safeNum(e.target.value);saveSafe()});const a=document.getElementById('addBucketBtn');if(a)a.onclick=()=>{cfg.buckets.push({id:uid(),name:'New Bucket',emoji:'📦',color:'#888',weeklyAmount:0,priority:10,type:'flexible',targetAmount:null,currentBalance:0,rollover:false,active:true});saveSafe();render()};const save=document.getElementById('saveSettingsBtn');if(save)save.onclick=()=>{cfg.aiProvider=(document.getElementById('aiProvider').value||'openai').toLowerCase();cfg.openaiApiKey=(document.getElementById('openaiKey').value||'').trim();cfg.claudeApiKey=(document.getElementById('claudeKey').value||'').trim();cfg.openaiModel=(document.getElementById('openaiModel').value||'gpt-5.2').trim()||'gpt-5.2';cfg.claudeModel=(document.getElementById('claudeModel').value||'claude-sonnet-4-20250514').trim()||'claude-sonnet-4-20250514';cfg.currency=(document.getElementById('c').value||'AUD').trim().toUpperCase();saveSafe();render()};const b=document.getElementById('backupBtn');if(b)b.onclick=expBackup;const imp=document.getElementById('imp');if(imp)imp.onchange=impBackup;const pc=document.getElementById('planCsvBtn');if(pc)pc.onclick=expPlanCSV;const wc=document.getElementById('weeklyCsvBtn');if(wc)wc.onclick=expWeeklyCSV;const rs=document.getElementById('resetBtn');if(rs)rs.onclick=()=>{if(confirm('Reset all local data?')){cfg=clone(CFG0);data=clone(DATA0);previewState=null;saveSafe();render()}};const tk=document.getElementById('testOpenAIKeyBtn');if(tk)tk.onclick=testOpenAIKey;const as=document.getElementById('aiSend');if(as)as.onclick=askAI;const aw=document.getElementById('aiWeek');if(aw)aw.onclick=weeklyReview;const appInfo=document.getElementById('appInfo');if(appInfo&&window.finosAPI?.appInfo)window.finosAPI.appInfo().then(i=>appInfo.textContent=`${i.name} v${i.version} (${i.platform}) • Electron ${i.electron}`).catch(()=>appInfo.textContent='Could not load app info.')}
function confirmWeek(){if(!previewState)return;const p=previewState;const entry={id:uid(),date:new Date().toISOString(),incomeAmount:p.income,plannedTotal:p.plannedTotal,allocatedTotal:p.allocatedTotal,leftover:p.leftover,shortfall:p.shortfall,allocations:p.allocations,notes:p.notes,aiSummary:''};data.weeklyEntries.unshift(entry);for(const a of p.allocations){const b=cfg.buckets.find(x=>x.id===a.bucketId);if(!b)continue;if(b.rollover||['debt','savings','goal','buffer'].includes(b.type))b.currentBalance=safeNum(b.currentBalance)+safeNum(a.allocatedAmount)}const buffer=cfg.buckets.find(b=>b.type==='buffer'||b.name==='Leftover / Buffer');if(buffer&&buffer.rollover&&p.leftover>0)buffer.currentBalance=safeNum(buffer.currentBalance)+p.leftover;saveSafe();previewState=null;tab='dashboard';render()}
async function callAI(prompt,responseFormat='text'){if(!window.finosAPI?.aiMessage)throw new Error('AI bridge unavailable.');const provider=(cfg.aiProvider||'openai').toLowerCase();const model=provider==='claude'?(cfg.claudeModel||'claude-sonnet-4-20250514'):(cfg.openaiModel||'gpt-5.2');const res=await window.finosAPI.aiMessage({provider,model,openaiApiKey:cfg.openaiApiKey||'',claudeApiKey:cfg.claudeApiKey||'',system:'You are FinOS AI coach for weekly income delegation.',input:String(prompt||'').slice(0,6000),responseFormat});if(!res||!res.success)throw new Error(res?.error||'AI request failed.');data.aiHistory.unshift({id:uid(),date:new Date().toISOString(),provider,prompt,response:res.text});saveSafe();return res}
async function testOpenAIKey(){const out=document.getElementById('openaiTestResult');const key=(document.getElementById('openaiKey')?.value||cfg.openaiApiKey||'').trim();if(!key){aiSetupMsg='Missing OpenAI API key.';if(out)out.textContent=aiSetupMsg;return;}if(out)out.textContent='Testing OpenAI key...';try{const res=await window.finosAPI.aiMessage({provider:'openai',model:cfg.openaiModel||'gpt-5.2',openaiApiKey:key,claudeApiKey:'',system:'Reply with exactly OK.',input:'Reply OK',responseFormat:'text'});if(res&&res.success){aiSetupMsg='✅ OpenAI key works.';cfg.openaiApiKey=key;saveSafe();}else{aiSetupMsg=`❌ ${res?.error||'OpenAI test failed.'}`;}if(out)out.textContent=aiSetupMsg;}catch(e){aiSetupMsg=`❌ ${e.message||'OpenAI test failed.'}`;if(out)out.textContent=aiSetupMsg;}}
async function askAI(){const out=document.getElementById('aires');const q=(document.getElementById('aiq')||{}).value||'How am I tracking against my plan?';if(out)out.textContent='Thinking...';aiBusy=true;try{const res=await callAI(q);if(out)out.textContent=res.text;}catch(e){if(out)out.textContent=e.message||'AI request failed.';}finally{aiBusy=false;}}
async function weeklyReview(){const out=document.getElementById('aires');const w=data.weeklyEntries[0];if(!w){if(out)out.textContent='No weekly entry available.';return;}if(out)out.textContent='Generating weekly review...';aiBusy=true;try{const prompt=`Weekly review for FinOS. Income: ${w.incomeAmount}, planned: ${w.plannedTotal}, allocated: ${w.allocatedTotal}, leftover: ${w.leftover}, shortfall: ${w.shortfall}, allocations: ${JSON.stringify(w.allocations)}. Return concise bullets: what went well, what is tight, what to improve, leftover suggestion, shortfall fix.`;const res=await callAI(prompt);w.aiSummary=res.text;saveSafe();if(out)out.textContent=res.text;}catch(e){if(out)out.textContent=e.message||'AI review failed.';}finally{aiBusy=false;}}
const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s};function dl(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}const stamp=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function expBackup(){dl(`finos-backup-${stamp()}.json`,JSON.stringify({cfg,data},null,2),'application/json')} async function impBackup(e){const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j||typeof j!=='object')throw new Error('Invalid backup format');cfg=loadSafe('__tmp__',{...CFG0,...j.cfg});data=loadSafe('__tmp2__',{...DATA0,...j.data});localStorage.removeItem('__tmp__');localStorage.removeItem('__tmp2__');saveSafe();render()}catch(err){alert(`Import failed: ${err.message}`)}finally{e.target.value=''}}
function expWeeklyCSV(){const rows=['date,income,planned,allocated,leftover,shortfall,notes'];data.weeklyEntries.forEach(w=>rows.push([w.date,w.incomeAmount,w.plannedTotal,w.allocatedTotal,w.leftover,w.shortfall,csvCell(w.notes||'')].join(',')));dl(`weekly-entries-${stamp()}.csv`,rows.join('\n'),'text/csv')} function expPlanCSV(){const rows=['name,type,priority,weeklyAmount,currentBalance,active,rollover'];cfg.buckets.forEach(b=>rows.push([csvCell(b.name),b.type,b.priority,b.weeklyAmount,b.currentBalance,b.active,b.rollover].join(',')));dl(`bucket-plan-${stamp()}.csv`,rows.join('\n'),'text/csv')}

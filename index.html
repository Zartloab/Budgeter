<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinOS</title>
<style>
*{box-sizing:border-box} :root{--bg:#07070F;--surface:#0F0F1A;--surface2:#181828;--border:rgba(255,255,255,.08);--text:#f2f2ff;--muted:#9090b4;--primary:#6ea8ff;--good:#55EFC4;--warn:#FFB86B;--bad:#FF6B7A;--radius:16px}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1a1a34 0%,var(--bg) 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;display:flex;justify-content:center;padding:12px;min-height:100vh}
#app{width:100%;max-width:520px;height:calc(100vh - 24px);background:linear-gradient(180deg,#0b0b17,#07070F);border:1px solid var(--border);border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.header{padding:14px 14px 10px;border-bottom:1px solid var(--border);background:rgba(15,15,26,.92);backdrop-filter:blur(4px)}
.title{font-size:22px;font-weight:800;letter-spacing:-.02em}.subtitle{font-size:12px;color:var(--muted)}
.content{flex:1;overflow:auto;padding:12px}
.card{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.num{font-size:24px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inp,textarea,select{width:100%;padding:9px 10px;background:#121225;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:10px;margin-top:6px}
.btn{background:#222743;border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer}.btn-cta{background:linear-gradient(135deg,#6EA8FF,#9A7BFF);color:#04030f;border:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:11px;border:1px solid var(--border);padding:4px 8px;border-radius:999px;color:#d7d7ff;background:rgba(255,255,255,.04)}
.status-funded{border-color:rgba(85,239,196,.4)}.status-partial{border-color:rgba(255,184,107,.5)}.status-skipped{border-color:rgba(255,107,122,.4)}
.progress{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#6EA8FF,#55EFC4)}
.bucket{padding:10px;border-radius:14px;border:1px solid var(--border);background:#141427}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px;border-top:1px solid var(--border);background:#0f0f1a}
.nav button{background:none;border:0;color:#7f7f9e;border-top:2px solid transparent;padding:7px 2px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button.active{color:#fff;border-top-color:#6EA8FF}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body><div id="app"></div>
<script>
'use strict';
const CFG_KEY='finos_cfg_v3', DATA_KEY='finos_data_v3';
const defaultBuckets=[['Rent','🏠','#74B9FF',1,'fixed',700],['Bills','⚡','#A29BFE',2,'fixed',180],['Groceries','🛒','#54A0FF',3,'fixed',150],['Spending','💳','#FDCB6E',9,'flexible',120],['Emergency Fund','🛟','#55EFC4',4,'goal',80],['Debt Repayment','💸','#FD79A8',5,'debt',120],['Savings','💰','#00CEC9',6,'savings',90],['Goals / Trips','✈️','#FF9F43',8,'goal',70],['Subscriptions','📱','#6C5CE7',7,'fixed',40],['Leftover / Buffer','🧱','#B2BEC3',99,'buffer',0]].map(([name,emoji,color,priority,type,weeklyAmount])=>({id:uid(),name,emoji,color,weeklyAmount,priority,type,targetAmount:null,currentBalance:0,rollover:type!=='flexible',active:true}));
const CFG0={currency:'AUD',aiProvider:'openai',openaiApiKey:'',claudeApiKey:'',openaiModel:'gpt-5.2',claudeModel:'claude-sonnet-4-20250514',emergencyTarget:2000,totalDebt:40500,buckets:defaultBuckets};
const DATA0={weeklyEntries:[],transactions:[],aiHistory:[]};
function uid(){return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`;}
function clone(v){return JSON.parse(JSON.stringify(v));}
function safeNum(v){return Number.isFinite(Number(v))?Number(v):0;}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
let cfg=loadSafe(CFG_KEY,CFG0),data=loadSafe(DATA_KEY,DATA0),tab='log',previewState=null,aiBusy=false,aiSetupMsg='';
function loadSafe(key,defaults){try{const raw=localStorage.getItem(key);if(!raw)return clone(defaults);const parsed=JSON.parse(raw);if(!parsed||typeof parsed!=='object')return clone(defaults);const merged={...clone(defaults),...parsed};if(!Array.isArray(merged.buckets))merged.buckets=clone(defaults.buckets);if(!Array.isArray(merged.weeklyEntries))merged.weeklyEntries=[];if(!Array.isArray(merged.transactions))merged.transactions=[];if(!Array.isArray(merged.aiHistory))merged.aiHistory=[];return merged;}catch{return clone(defaults)}}
function saveSafe(){localStorage.setItem(CFG_KEY,JSON.stringify(cfg));localStorage.setItem(DATA_KEY,JSON.stringify(data));}
function money(n){try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:cfg.currency||'AUD'}).format(safeNum(n));}catch{return `$${safeNum(n).toFixed(2)}`}}
function hasOpenAIKey(){return !!(cfg.openaiApiKey&&cfg.openaiApiKey.trim());}
function allocateIncome(incomeAmount,buckets){const income=Math.max(0,safeNum(incomeAmount));const active=(Array.isArray(buckets)?buckets:[]).filter(b=>b&&b.active!==false).sort((a,b)=>safeNum(a.priority)-safeNum(b.priority));const plannedBuckets=active.filter(b=>b.type!=='buffer'&&b.name!=='Leftover / Buffer');let remaining=income;const allocations=[];const plannedTotal=plannedBuckets.reduce((s,b)=>s+Math.max(0,safeNum(b.weeklyAmount)),0);for(const b of plannedBuckets){const plannedAmount=Math.max(0,safeNum(b.weeklyAmount));let allocatedAmount=0;let status='skipped';if(remaining>=plannedAmount){allocatedAmount=plannedAmount;status='funded';}else if(remaining>0){allocatedAmount=remaining;status='partial';}remaining=Math.max(0,remaining-allocatedAmount);allocations.push({bucketId:b.id,bucketName:b.name,plannedAmount,allocatedAmount,status});}const allocatedTotal=allocations.reduce((s,a)=>s+safeNum(a.allocatedAmount),0);return {plannedTotal,allocatedTotal,leftover:Math.max(0,remaining),shortfall:Math.max(0,plannedTotal-income),allocations};}
const NAV=[['dashboard','🏠','Dash'],['log','💵','Income'],['plan','📋','Plan'],['history','🗂','History'],['ai','🤖','AI'],['settings','⚙️','Set']];
function render(){const title=tab==='dashboard'?'Dashboard':tab==='log'?'Log Income':tab==='plan'?'Money Plan':tab==='history'?'History':tab==='ai'?'AI Coach':'Settings';document.getElementById('app').innerHTML=`<div class='header'><div class='title'>FinOS</div><div class='subtitle'>${title}</div></div><div class='content'>${view()}</div><div class='nav'>${NAV.map(([k,i,l])=>`<button class='${tab===k?'active':''}' data-tab='${k}'><span>${i}</span><span>${l}</span></button>`).join('')}</div>`;bindEvents();}
function view(){if(tab==='log')return logView();if(tab==='plan')return planView();if(tab==='history')return historyView();if(tab==='ai')return aiView();if(tab==='settings')return settingsView();return dashView();}
function dashView(){const w=data.weeklyEntries[0];const eBal=(cfg.buckets.find(b=>b.name==='Emergency Fund')||{}).currentBalance||0;const dBal=(cfg.buckets.find(b=>b.name==='Debt Repayment')||{}).currentBalance||0;return `<div class='card'><div class='label'>Hero Summary</div><div class='num'>${money(w?.incomeAmount||0)}</div><div class='small'>Weekly income delegation at a glance</div></div><div class='grid2'><div class='card'><div class='label'>Allocated</div><div class='num'>${money(w?.allocatedTotal||0)}</div></div><div class='card'><div class='label'>Leftover / Buffer</div><div class='num' style='color:#55EFC4'>${money(w?.leftover||0)}</div></div></div><div class='card'><div class='label'>This week</div><div class='small'>Shortfall: <b>${money(w?.shortfall||0)}</b></div></div><div class='grid2'>${cfg.buckets.map(b=>`<div class='bucket'><div class='row'><span>${esc(b.emoji)} ${esc(b.name)}</span><span class='pill'>${esc(b.type)}</span></div><div><b>${money(b.currentBalance)}</b></div><div class='small'>Weekly ${money(b.weeklyAmount)}</div>${b.targetAmount?`<div class='progress'><div class='bar' style='width:${Math.min(100,Math.round((safeNum(b.currentBalance)/safeNum(b.targetAmount))*100))}%'></div></div>`:''}</div>`).join('')}</div><div class='grid2'><div class='card'><div class='label'>Emergency</div><div><b>${money(eBal)}</b> / ${money(cfg.emergencyTarget)}</div></div><div class='card'><div class='label'>Debt</div><div><b>${money(dBal)}</b> / ${money(cfg.totalDebt)}</div></div></div>`;}
function logView(){return `<div class='card'><div class='label'>Weekly income</div><input id='income' class='inp' type='number' placeholder='Enter salary/income'/><textarea id='notes' class='inp' placeholder='Optional notes'></textarea><button class='btn btn-cta' id='previewBtn'>Preview Allocation</button></div>${previewState?`<div class='card'><div class='label'>Allocation preview</div>${previewState.allocations.map(a=>`<div class='bucket status-${a.status}'><div class='row'><b>${esc(a.bucketName)}</b><span class='pill'>${a.status}</span></div><div class='small'>Planned ${money(a.plannedAmount)} • Allocated ${money(a.allocatedAmount)}</div></div>`).join('')}<div class='card' style='margin-top:8px'><div class='row'><b>Leftover</b><b style='color:#55EFC4'>${money(previewState.leftover)}</b></div><div class='row'><b>Shortfall</b><b style='color:#FFB86B'>${money(previewState.shortfall)}</b></div></div><button class='btn btn-cta' id='confirmBtn'>Confirm Week</button></div>`:''}`;}
function planView(){return `<div class='card'><div class='label'>Bucket plan</div>${cfg.buckets.map((b,i)=>`<div class='bucket'><div class='row'><b>${esc(b.emoji)} ${esc(b.name)}</b><span class='pill'>P${safeNum(b.priority)}</span></div><div class='row'><span class='pill'>${esc(b.type)}</span><span class='small'>${b.active!==false?'Active':'Inactive'}</span></div><div class='grid2'><input class='inp' data-b='${i}' data-k='weeklyAmount' type='number' value='${safeNum(b.weeklyAmount)}'/><input class='inp' data-b='${i}' data-k='priority' type='number' value='${safeNum(b.priority)}'/></div></div>`).join('')}<button class='btn btn-cta' id='addBucketBtn'>Add Bucket</button></div>`;}
function historyView(){return `<div class='card'><div class='row'><div class='label'>Weekly history</div><button class='btn' id='weeklyCsvBtn'>CSV</button></div>${data.weeklyEntries.length?data.weeklyEntries.map(e=>`<details class='bucket'><summary><b>${new Date(e.date).toLocaleDateString()}</b> • ${money(e.incomeAmount)}</summary><div class='small'>Allocated ${money(e.allocatedTotal)} • Leftover ${money(e.leftover)} • Shortfall ${money(e.shortfall)}</div>${(e.allocations||[]).map(a=>`<div class='small'>${esc(a.bucketName)} — ${money(a.allocatedAmount)} (${a.status})</div>`).join('')}</details>`).join(''):`<div class='small'>No weekly entries yet.</div>`}</div>`;}
function aiView(){const need=!hasOpenAIKey();const pm=cfg.aiProvider==='claude'?(cfg.claudeModel||'claude-sonnet-4-20250514'):(cfg.openaiModel||'gpt-5.2');const pn=cfg.aiProvider==='claude'?'Claude':'OpenAI';return `<div class='card'><div class='row'><div class='label'>AI Coach</div><span class='pill'>Using ${pn} ${esc(pm)}</span></div>${need?`<div class='small'>Setup required: Add OpenAI key in Settings.</div>`:''}<textarea id='aiq' class='inp' ${need?'disabled':''} placeholder='Ask My Money...'></textarea><div class='row'><button class='btn btn-cta' id='aiSend' ${need?'disabled':''}>${aiBusy?'Loading...':'Send'}</button><button class='btn' id='aiWeek' ${(need||!data.weeklyEntries.length)?'disabled':''}>Weekly Review</button></div><div id='aires' class='small'>${need?'AI disabled until key setup.':'Helpful coaching will appear here.'}</div></div>`;}
function settingsView(){const firstRun=!hasOpenAIKey();return `<div class='card'><div class='label'>API setup</div>${firstRun?`<div class='small'>First-run setup: paste OpenAI key and test.</div>`:''}<label class='small'>AI Provider</label><select class='inp' id='aiProvider'><option value='openai' ${cfg.aiProvider==='openai'?'selected':''}>OpenAI</option><option value='claude' ${cfg.aiProvider==='claude'?'selected':''}>Claude</option></select><label class='small'>OpenAI API Key</label><input class='inp' id='openaiKey' value='${esc(cfg.openaiApiKey||'')}' placeholder='sk-...'/><div class='small'>Your API key is stored only on this device. It is not uploaded anywhere except when making requests to OpenAI.</div><button class='btn' id='testOpenAIKeyBtn'>Test OpenAI Key</button><div id='openaiTestResult' class='small'>${esc(aiSetupMsg||'')}</div><label class='small'>Claude API Key</label><input class='inp' id='claudeKey' value='${esc(cfg.claudeApiKey||'')}'/><label class='small'>OpenAI Model</label><input class='inp' id='openaiModel' value='${esc(cfg.openaiModel||'gpt-5.2')}'/><label class='small'>Claude Model</label><input class='inp' id='claudeModel' value='${esc(cfg.claudeModel||'claude-sonnet-4-20250514')}'/><label class='small'>Currency</label><input class='inp' id='c' value='${esc(cfg.currency||'AUD')}'/><button class='btn btn-cta' id='saveSettingsBtn'>Save Settings</button></div><div class='card'><div class='label'>Data</div><button class='btn' id='backupBtn'>Export Backup JSON</button><input type='file' id='imp'/><button class='btn' id='planCsvBtn'>Export Bucket Plan CSV</button><button class='btn' id='weeklyCsvBtn'>Export Weekly CSV</button></div><div class='card'><div class='label'>Danger Zone</div><button class='btn' id='resetBtn'>Reset Data</button><div id='appInfo' class='small'>Loading app info...</div></div>`;}
function bindEvents(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});const p=document.getElementById('previewBtn');if(p)p.onclick=()=>{previewState={income:safeNum(document.getElementById('income').value),notes:document.getElementById('notes').value||'',...allocateIncome(safeNum(document.getElementById('income').value),cfg.buckets)};render();};const c=document.getElementById('confirmBtn');if(c)c.onclick=confirmWeek;document.querySelectorAll('[data-b]').forEach(el=>el.onchange=(e)=>{const i=Number(e.target.dataset.b),k=e.target.dataset.k;if(cfg.buckets[i])cfg.buckets[i][k]=safeNum(e.target.value);saveSafe();});const a=document.getElementById('addBucketBtn');if(a)a.onclick=()=>{cfg.buckets.push({id:uid(),name:'New Bucket',emoji:'📦',color:'#888',weeklyAmount:0,priority:10,type:'flexible',targetAmount:null,currentBalance:0,rollover:false,active:true});saveSafe();render();};const save=document.getElementById('saveSettingsBtn');if(save)save.onclick=()=>{cfg.aiProvider=(document.getElementById('aiProvider').value||'openai').toLowerCase();cfg.openaiApiKey=(document.getElementById('openaiKey').value||'').trim();cfg.claudeApiKey=(document.getElementById('claudeKey').value||'').trim();cfg.openaiModel=(document.getElementById('openaiModel').value||'gpt-5.2').trim()||'gpt-5.2';cfg.claudeModel=(document.getElementById('claudeModel').value||'claude-sonnet-4-20250514').trim()||'claude-sonnet-4-20250514';cfg.currency=(document.getElementById('c').value||'AUD').trim().toUpperCase();saveSafe();render();};const b=document.getElementById('backupBtn');if(b)b.onclick=expBackup;const imp=document.getElementById('imp');if(imp)imp.onchange=impBackup;const plan=document.getElementById('planCsvBtn');if(plan)plan.onclick=expPlanCSV;const wc=document.getElementById('weeklyCsvBtn');if(wc)wc.onclick=expWeeklyCSV;const reset=document.getElementById('resetBtn');if(reset)reset.onclick=()=>{if(confirm('Reset all local data?')){cfg=clone(CFG0);data=clone(DATA0);previewState=null;saveSafe();render();}};const ts=document.getElementById('testOpenAIKeyBtn');if(ts)ts.onclick=testOpenAIKey;const send=document.getElementById('aiSend');if(send)send.onclick=askAI;const wk=document.getElementById('aiWeek');if(wk)wk.onclick=weeklyReview;const appInfo=document.getElementById('appInfo');if(appInfo&&window.finosAPI?.appInfo)window.finosAPI.appInfo().then(i=>appInfo.textContent=`${i.name} v${i.version} (${i.platform}) • Electron ${i.electron}`).catch(()=>appInfo.textContent='Could not load app info.');}
function confirmWeek(){if(!previewState)return;const p=previewState;const entry={id:uid(),date:new Date().toISOString(),incomeAmount:p.income,plannedTotal:p.plannedTotal,allocatedTotal:p.allocatedTotal,leftover:p.leftover,shortfall:p.shortfall,allocations:p.allocations,notes:p.notes,aiSummary:''};data.weeklyEntries.unshift(entry);for(const a of p.allocations){const b=cfg.buckets.find(x=>x.id===a.bucketId);if(!b)continue;if(b.rollover||['debt','savings','goal','buffer'].includes(b.type))b.currentBalance=safeNum(b.currentBalance)+safeNum(a.allocatedAmount);}const buffer=cfg.buckets.find(b=>b.type==='buffer'||b.name==='Leftover / Buffer');if(buffer&&buffer.rollover&&p.leftover>0)buffer.currentBalance=safeNum(buffer.currentBalance)+p.leftover;saveSafe();previewState=null;tab='dashboard';render();}
async function callAI(prompt,responseFormat='text'){if(!window.finosAPI?.aiMessage)throw new Error('AI bridge unavailable. Restart app.');const provider=(cfg.aiProvider||'openai').toLowerCase();const model=provider==='claude'?(cfg.claudeModel||'claude-sonnet-4-20250514'):(cfg.openaiModel||'gpt-5.2');const res=await window.finosAPI.aiMessage({provider,model,openaiApiKey:cfg.openaiApiKey||'',claudeApiKey:cfg.claudeApiKey||'',system:'You are FinOS AI coach for weekly income delegation.',input:String(prompt||'').slice(0,6000),responseFormat});if(!res||!res.success)throw new Error(res?.error||'AI request failed.');data.aiHistory.unshift({id:uid(),date:new Date().toISOString(),provider,prompt,response:res.text});saveSafe();return res;}
async function testOpenAIKey(){const out=document.getElementById('openaiTestResult');const key=(document.getElementById('openaiKey')?.value||cfg.openaiApiKey||'').trim();if(!key){aiSetupMsg='Missing OpenAI API key.';if(out)out.textContent=aiSetupMsg;return;}if(out)out.textContent='Testing OpenAI key...';try{const res=await window.finosAPI.aiMessage({provider:'openai',model:cfg.openaiModel||'gpt-5.2',openaiApiKey:key,claudeApiKey:'',system:'Reply with exactly OK.',input:'Reply OK',responseFormat:'text'});if(res&&res.success){aiSetupMsg='✅ OpenAI key works.';cfg.openaiApiKey=key;saveSafe();}else{aiSetupMsg=`❌ ${res?.error||'OpenAI test failed.'}`;}if(out)out.textContent=aiSetupMsg;}catch(e){aiSetupMsg=`❌ ${e.message||'OpenAI test failed.'}`;if(out)out.textContent=aiSetupMsg;}}
async function askAI(){const out=document.getElementById('aires');const q=(document.getElementById('aiq')||{}).value||'How am I tracking against my plan?';if(out)out.textContent='Thinking...';aiBusy=true;try{const res=await callAI(q);if(out)out.textContent=res.text;}catch(e){if(out)out.textContent=e.message||'AI request failed.';}finally{aiBusy=false;}}
async function weeklyReview(){const out=document.getElementById('aires');const w=data.weeklyEntries[0];if(!w){if(out)out.textContent='No weekly entry available.';return;}if(out)out.textContent='Generating weekly review...';aiBusy=true;try{const prompt=`Weekly review for FinOS. Income: ${w.incomeAmount}, planned: ${w.plannedTotal}, allocated: ${w.allocatedTotal}, leftover: ${w.leftover}, shortfall: ${w.shortfall}, allocations: ${JSON.stringify(w.allocations)}. Return concise bullets: what went well, what is tight, what to improve, leftover suggestion, shortfall fix.`;const res=await callAI(prompt);w.aiSummary=res.text;saveSafe();if(out)out.textContent=res.text;}catch(e){if(out)out.textContent=e.message||'AI review failed.';}finally{aiBusy=false;}}
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s;} function dl(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);} function stamp(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function expBackup(){dl(`finos-backup-${stamp()}.json`,JSON.stringify({cfg,data},null,2),'application/json');}
async function impBackup(e){const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j||typeof j!=='object')throw new Error('Invalid backup format');cfg=loadSafe('__tmp__',{...CFG0,...j.cfg});data=loadSafe('__tmp2__',{...DATA0,...j.data});localStorage.removeItem('__tmp__');localStorage.removeItem('__tmp2__');saveSafe();render();}catch(err){alert(`Import failed: ${err.message}`);}finally{e.target.value='';}}
function expWeeklyCSV(){const rows=['date,income,planned,allocated,leftover,shortfall,notes'];data.weeklyEntries.forEach(w=>rows.push([w.date,w.incomeAmount,w.plannedTotal,w.allocatedTotal,w.leftover,w.shortfall,csvCell(w.notes||'')].join(',')));dl(`weekly-entries-${stamp()}.csv`,rows.join('\n'),'text/csv');}
function expPlanCSV(){const rows=['name,type,priority,weeklyAmount,currentBalance,active,rollover'];cfg.buckets.forEach(b=>rows.push([csvCell(b.name),b.type,b.priority,b.weeklyAmount,b.currentBalance,b.active,b.rollover].join(',')));dl(`bucket-plan-${stamp()}.csv`,rows.join('\n'),'text/csv');}
window.addEventListener('error',e=>console.error('Renderer error:',e.message));window.addEventListener('unhandledrejection',e=>console.error('Unhandled promise rejection:',e.reason));render();
</script></body></html>

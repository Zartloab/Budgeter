<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinOS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070F;color:#F0F0FF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#app{max-width:520px;margin:auto;padding:12px}.card{background:#0F0F1A;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px;margin:10px 0}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;position:sticky;top:0;background:#07070F;padding-bottom:8px}.nav button{border:1px solid rgba(255,255,255,.1);background:#161626;color:#bbb;border-radius:8px;padding:8px 4px;font-size:11px;cursor:pointer}.nav button.active{color:#fff;border-color:#54A0FF}.inp,textarea,select{width:100%;background:#161626;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px;margin:4px 0}table{width:100%;font-size:12px;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid rgba(255,255,255,.08)}.btn{background:#54A0FF;border:0;border-radius:8px;padding:8px 10px;color:#001;font-weight:700;cursor:pointer;margin-right:4px;margin-top:6px}.muted{color:#8e8eb0;font-size:12px}.toast{padding:8px;border-radius:8px;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const CFG_KEY='finos_cfg_v3', DATA_KEY='finos_data_v3';
const defaultBuckets=[['Rent','🏠','#74B9FF',1,'fixed',700],['Bills','⚡','#A29BFE',2,'fixed',180],['Groceries','🛒','#54A0FF',3,'fixed',150],['Spending','💳','#FDCB6E',9,'flexible',120],['Emergency Fund','🛟','#55EFC4',4,'goal',80],['Debt Repayment','💸','#FD79A8',5,'debt',120],['Savings','💰','#00CEC9',6,'savings',90],['Goals / Trips','✈️','#FF9F43',8,'goal',70],['Subscriptions','📱','#6C5CE7',7,'fixed',40],['Leftover / Buffer','🧱','#B2BEC3',99,'buffer',0]]
  .map(([name,emoji,color,priority,type,weeklyAmount])=>({id:uid(),name,emoji,color,weeklyAmount,priority,type,targetAmount:null,currentBalance:0,rollover:type!=='flexible',active:true}));
const CFG0={currency:'AUD',aiProvider:'openai',openaiApiKey:'',claudeApiKey:'',openaiModel:'gpt-5.2',claudeModel:'claude-sonnet-4-20250514',emergencyTarget:2000,totalDebt:40500,buckets:defaultBuckets};
const DATA0={weeklyEntries:[],transactions:[],aiHistory:[]};

let cfg=loadSafe(CFG_KEY,CFG0),data=loadSafe(DATA_KEY,DATA0),tab='log',previewState=null,aiBusy=false,aiSetupMsg='';

function uid(){return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`;}
function clone(v){return JSON.parse(JSON.stringify(v));}
function toast(msg,bad){const c=bad?'rgba(255,92,92,.2)':'rgba(85,239,196,.2)';return `<div class='toast' style='background:${c}'>${esc(msg)}</div>`}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
function safeNum(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function loadSafe(key,defaults){
  try {
    const raw=localStorage.getItem(key);
    if(!raw) return clone(defaults);
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=='object') return clone(defaults);
    const merged={...clone(defaults),...parsed};
    if(!Array.isArray(merged.buckets)) merged.buckets=clone(defaults.buckets);
    if(!Array.isArray(merged.weeklyEntries)) merged.weeklyEntries=[];
    if(!Array.isArray(merged.transactions)) merged.transactions=[];
    if(!Array.isArray(merged.aiHistory)) merged.aiHistory=[];
    return merged;
  } catch {
    return clone(defaults);
  }
}
function saveSafe(){
  try {
    localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
    localStorage.setItem(DATA_KEY,JSON.stringify(data));
  } catch (e) {
    console.error('Save failed',e);
  }
}
function money(n){try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:cfg.currency||'AUD'}).format(safeNum(n));}catch{return `$${safeNum(n).toFixed(2)}`}}

function hasOpenAIKey(){return !!(cfg.openaiApiKey&&cfg.openaiApiKey.trim());}

function allocateIncome(incomeAmount,buckets){
  const income=Math.max(0,safeNum(incomeAmount));
  const active=(Array.isArray(buckets)?buckets:[]).filter(b=>b&&b.active!==false).sort((a,b)=>safeNum(a.priority)-safeNum(b.priority));
  const plannedBuckets=active.filter(b=>b.type!=='buffer' && b.name!=='Leftover / Buffer');
  let remaining=income;
  const allocations=[];
  const plannedTotal=plannedBuckets.reduce((s,b)=>s+Math.max(0,safeNum(b.weeklyAmount)),0);
  for(const b of plannedBuckets){
    const plannedAmount=Math.max(0,safeNum(b.weeklyAmount));
    let allocatedAmount=0;let status='skipped';
    if(remaining>=plannedAmount){allocatedAmount=plannedAmount;status='funded';}
    else if(remaining>0){allocatedAmount=remaining;status='partial';}
    remaining=Math.max(0,remaining-allocatedAmount);
    allocations.push({bucketId:b.id,bucketName:b.name,plannedAmount,allocatedAmount,status});
  }
  const allocatedTotal=allocations.reduce((s,a)=>s+safeNum(a.allocatedAmount),0);
  return {plannedTotal,allocatedTotal,leftover:Math.max(0,remaining),shortfall:Math.max(0,plannedTotal-income),allocations};
}

function render(){document.getElementById('app').innerHTML=`<div class='nav'>${['dashboard','log','plan','history','ai','settings'].map(t=>`<button class='${tab===t?'active':''}' data-tab='${t}'>${t}</button>`).join('')}</div>${view()}`;bindNav();}
function bindNav(){document.querySelectorAll('[data-tab]').forEach((b)=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();}));}
function view(){if(tab==='log')return logView();if(tab==='plan')return planView();if(tab==='history')return historyView();if(tab==='ai')return aiView();if(tab==='settings')return settingsView();return dashView();}

function dashView(){const l=data.weeklyEntries[0];const eBal=(cfg.buckets.find(b=>b.name==='Emergency Fund')||{}).currentBalance||0;const dBal=(cfg.buckets.find(b=>b.name==='Debt Repayment')||{}).currentBalance||0;return `<div class='card'><h3>Dashboard</h3>${l?`<p>This Week: ${money(l.incomeAmount)} | Allocated: ${money(l.allocatedTotal)} | Leftover: ${money(l.leftover)} | Shortfall: ${money(l.shortfall)}</p>`:'<p class="muted">No weekly entries yet.</p>'}</div><div class='card'><h4>Bucket Balances</h4>${cfg.buckets.map(b=>`<div>${esc(b.emoji)} ${esc(b.name)}: ${money(b.currentBalance)}</div>`).join('')}</div><div class='card'><p>Emergency Progress: ${money(eBal)} / ${money(cfg.emergencyTarget)}</p><p>Debt Progress: ${money(dBal)} / ${money(cfg.totalDebt)}</p></div>`;}
function logView(){return `<div class='card'><h3>Log Income (Primary)</h3><input id='income' class='inp' type='number' placeholder='Weekly salary/income'/><textarea id='notes' placeholder='Optional notes'></textarea><button class='btn' id='previewBtn'>Preview Allocation</button><div id='preview'>${previewState?renderPreview(previewState):"<p class='muted'>Enter income and preview allocation.</p>"}</div></div>`;}
function renderPreview(p){return `<table><tr><th>Bucket</th><th>Planned</th><th>Allocated</th><th>Status</th></tr>${p.allocations.map(a=>`<tr><td>${esc(a.bucketName)}</td><td>${money(a.plannedAmount)}</td><td>${money(a.allocatedAmount)}</td><td>${a.status}</td></tr>`).join('')}</table><p>Leftover / Buffer: ${money(p.leftover)} | Shortfall: ${money(p.shortfall)}</p><button class='btn' id='confirmBtn'>Confirm Week</button>`;}

function planView(){return `<div class='card'><h3>Money Plan</h3>${cfg.buckets.map((b,i)=>`<div style='margin-bottom:10px'><input class='inp' value='${esc(b.name)}' data-b='${i}' data-k='name'/><input class='inp' type='number' value='${safeNum(b.weeklyAmount)}' data-b='${i}' data-k='weeklyAmount'/><input class='inp' type='number' value='${safeNum(b.priority)}' data-b='${i}' data-k='priority'/><select class='inp' data-b='${i}' data-k='type'>${['fixed','flexible','goal','debt','savings','buffer'].map(t=>`<option ${b.type===t?'selected':''} value='${t}'>${t}</option>`).join('')}</select><label class='muted'><input type='checkbox' data-b='${i}' data-k='active' ${b.active!==false?'checked':''}/> active</label> <label class='muted'><input type='checkbox' data-b='${i}' data-k='rollover' ${b.rollover?'checked':''}/> rollover</label></div>`).join('')}<button class='btn' id='addBucketBtn'>Add Bucket</button></div>`;}
function historyView(){return `<div class='card'><h3>History</h3><button class='btn' id='weeklyCsvBtn'>Export Weekly CSV</button>${data.weeklyEntries.length===0?"<p class='muted'>No weekly history yet.</p>":data.weeklyEntries.map(e=>`<details><summary>${new Date(e.date).toLocaleDateString()} - ${money(e.incomeAmount)}</summary>${(e.allocations||[]).map(a=>`<div>${esc(a.bucketName)}: ${money(a.allocatedAmount)} (${a.status})</div>`).join('')}<div class='muted'>Notes: ${esc(e.notes||'')}</div></details>`).join('')}</div>`;}
function aiView(){const pm=cfg.aiProvider==='claude'?(cfg.claudeModel||'claude-sonnet-4-20250514'):(cfg.openaiModel||'gpt-5.2');const pn=cfg.aiProvider==='claude'?'Claude':'OpenAI';const needSetup=!hasOpenAIKey();return `<div class='card'><h3>AI Coach</h3><div class='muted'>Using ${pn} ${esc(pm)}</div>${needSetup?`<div class='toast' style='background:rgba(255,159,67,.2)'><strong>Setup required:</strong> Add your OpenAI API key in Settings to enable AI Coach.</div>`:''}<textarea id='aiq' placeholder='Ask My Money...' ${needSetup?'disabled':''}></textarea><button class='btn' id='aiSend' ${needSetup?'disabled':''}>${aiBusy?'Loading...':'Send'}</button><button class='btn' id='aiWeek' ${(data.weeklyEntries.length===0||needSetup)?'disabled':''}>Generate Weekly Review</button><div id='aires' class='muted'>${needSetup?'AI is disabled until OpenAI key is set.':'AI works only when key is set and internet is available.'}</div></div>`;}
function settingsView(){const firstRun=!hasOpenAIKey();return `<div class='card'><h3>Settings</h3>${firstRun?`<div class='toast' style='background:rgba(255,159,67,.2)'><strong>First-run setup:</strong> Paste your OpenAI API key below and click <strong>Test OpenAI Key</strong>.</div>`:''}<label>AI Provider</label><select class='inp' id='aiProvider'><option value='openai' ${cfg.aiProvider==='openai'?'selected':''}>OpenAI</option><option value='claude' ${cfg.aiProvider==='claude'?'selected':''}>Claude</option></select><label>OpenAI API Key</label><input class='inp' id='openaiKey' value='${esc(cfg.openaiApiKey||'')}' placeholder='sk-...'/><div class='muted'>Your API key is stored only on this device. It is not uploaded anywhere except when making requests to OpenAI.</div><button class='btn' id='testOpenAIKeyBtn'>Test OpenAI Key</button><div id='openaiTestResult' class='muted'>${esc(aiSetupMsg||'')}</div><label>Claude API Key</label><input class='inp' id='claudeKey' value='${esc(cfg.claudeApiKey||'')}'/><label>OpenAI Model</label><input class='inp' id='openaiModel' value='${esc(cfg.openaiModel||'gpt-5.2')}'/><label>Claude Model</label><input class='inp' id='claudeModel' value='${esc(cfg.claudeModel||'claude-sonnet-4-20250514')}'/><label>Currency</label><input class='inp' id='c' value='${esc(cfg.currency||'AUD')}'/><button class='btn' id='saveSettingsBtn'>Save</button><button class='btn' id='backupBtn'>Export Backup JSON</button><input type='file' id='imp'/><button class='btn' id='planCsvBtn'>Export Bucket Plan CSV</button><button class='btn' id='resetBtn'>Reset Data</button><div id='appInfo' class='muted'>Loading app info...</div></div>`;}

function bindViewEvents(){
  const previewBtn=document.getElementById('previewBtn');
  if(previewBtn) previewBtn.addEventListener('click',()=>{const income=safeNum(document.getElementById('income').value);const notes=document.getElementById('notes').value||'';previewState={income,notes,...allocateIncome(income,cfg.buckets)};render();});
  const confirmBtn=document.getElementById('confirmBtn');
  if(confirmBtn) confirmBtn.addEventListener('click',confirmWeek);

  document.querySelectorAll('[data-b]').forEach((el)=>{el.addEventListener('change',(e)=>{const i=Number(e.target.dataset.b);const k=e.target.dataset.k;if(!cfg.buckets[i])return;cfg.buckets[i][k]=e.target.type==='checkbox'?e.target.checked:(k==='weeklyAmount'||k==='priority'?safeNum(e.target.value):e.target.value);saveSafe();});});
  const addBucketBtn=document.getElementById('addBucketBtn');
  if(addBucketBtn) addBucketBtn.addEventListener('click',()=>{cfg.buckets.push({id:uid(),name:'New Bucket',emoji:'📦',color:'#888',weeklyAmount:0,priority:10,type:'flexible',targetAmount:null,currentBalance:0,rollover:false,active:true});saveSafe();render();});

  const weeklyCsvBtn=document.getElementById('weeklyCsvBtn'); if(weeklyCsvBtn) weeklyCsvBtn.addEventListener('click',expWeeklyCSV);
  const aiSend=document.getElementById('aiSend'); if(aiSend) aiSend.addEventListener('click',askAI);
  const aiWeek=document.getElementById('aiWeek'); if(aiWeek) aiWeek.addEventListener('click',weeklyReview);

  const saveSettingsBtn=document.getElementById('saveSettingsBtn'); if(saveSettingsBtn) saveSettingsBtn.addEventListener('click',()=>{cfg.aiProvider=(document.getElementById('aiProvider').value||'openai').toLowerCase();cfg.openaiApiKey=(document.getElementById('openaiKey').value||'').trim();cfg.claudeApiKey=(document.getElementById('claudeKey').value||'').trim();cfg.openaiModel=(document.getElementById('openaiModel').value||'gpt-5.2').trim()||'gpt-5.2';cfg.claudeModel=(document.getElementById('claudeModel').value||'claude-sonnet-4-20250514').trim()||'claude-sonnet-4-20250514';cfg.currency=(document.getElementById('c').value||'AUD').trim().toUpperCase();saveSafe();render();});
  const testOpenAIKeyBtn=document.getElementById('testOpenAIKeyBtn'); if(testOpenAIKeyBtn) testOpenAIKeyBtn.addEventListener('click',testOpenAIKey);
  const backupBtn=document.getElementById('backupBtn'); if(backupBtn) backupBtn.addEventListener('click',expBackup);
  const planCsvBtn=document.getElementById('planCsvBtn'); if(planCsvBtn) planCsvBtn.addEventListener('click',expPlanCSV);
  const resetBtn=document.getElementById('resetBtn'); if(resetBtn) resetBtn.addEventListener('click',()=>{if(confirm('Reset all local data?')){cfg=clone(CFG0);data=clone(DATA0);previewState=null;saveSafe();render();}});
  const imp=document.getElementById('imp'); if(imp) imp.addEventListener('change',impBackup);

  const appInfo=document.getElementById('appInfo');
  if(appInfo && window.finosAPI?.appInfo){window.finosAPI.appInfo().then((info)=>{appInfo.textContent=`${info.name} v${info.version} (${info.platform}) • Electron ${info.electron}`;}).catch(()=>{appInfo.textContent='Could not load app info.';});}
}

function confirmWeek(){if(!previewState)return;const p=previewState;const entry={id:uid(),date:new Date().toISOString(),incomeAmount:p.income,plannedTotal:p.plannedTotal,allocatedTotal:p.allocatedTotal,leftover:p.leftover,shortfall:p.shortfall,allocations:p.allocations,notes:p.notes,aiSummary:''};data.weeklyEntries.unshift(entry);for(const a of p.allocations){const b=cfg.buckets.find(x=>x.id===a.bucketId);if(!b)continue;if(b.rollover||['debt','savings','goal','buffer'].includes(b.type))b.currentBalance=safeNum(b.currentBalance)+safeNum(a.allocatedAmount);}const buffer=cfg.buckets.find(b=>b.type==='buffer'||b.name==='Leftover / Buffer');if(buffer&&buffer.rollover&&p.leftover>0)buffer.currentBalance=safeNum(buffer.currentBalance)+p.leftover;saveSafe();previewState=null;tab='dashboard';render();}

async function callAI(prompt,responseFormat='text'){if(!window.finosAPI?.aiMessage)throw new Error('AI bridge unavailable. Restart app.');const provider=(cfg.aiProvider||'openai').toLowerCase();const model=provider==='claude'?(cfg.claudeModel||'claude-sonnet-4-20250514'):(cfg.openaiModel||'gpt-5.2');const res=await window.finosAPI.aiMessage({provider,model,openaiApiKey:cfg.openaiApiKey||'',claudeApiKey:cfg.claudeApiKey||'',system:'You are FinOS AI coach for weekly income delegation.',input:String(prompt||'').slice(0,6000),responseFormat});if(!res||!res.success)throw new Error(res?.error||'AI request failed.');data.aiHistory.unshift({id:uid(),date:new Date().toISOString(),provider,prompt,response:res.text});saveSafe();return res;}
async function askAI(){const out=document.getElementById('aires');const q=(document.getElementById('aiq')||{}).value||'How am I tracking against my plan?';if(out)out.textContent='Thinking...';aiBusy=true;try{const res=await callAI(q);if(out)out.textContent=res.text;}catch(e){if(out)out.textContent=e.message||'AI request failed.';}finally{aiBusy=false;}}
async function testOpenAIKey(){const out=document.getElementById('openaiTestResult');const key=(document.getElementById('openaiKey')?.value||cfg.openaiApiKey||'').trim();if(!key){aiSetupMsg='Missing OpenAI API key.';if(out)out.textContent=aiSetupMsg;return;}if(out)out.textContent='Testing OpenAI key...';try{const res=await window.finosAPI.aiMessage({provider:'openai',model:cfg.openaiModel||'gpt-5.2',openaiApiKey:key,claudeApiKey:'',system:'Reply with exactly OK.',input:'Reply OK',responseFormat:'text'});if(res&&res.success){aiSetupMsg='✅ OpenAI key works.';cfg.openaiApiKey=key;saveSafe();}else{aiSetupMsg=`❌ ${res?.error||'OpenAI test failed.'}`;}if(out)out.textContent=aiSetupMsg;}catch(e){aiSetupMsg=`❌ ${e.message||'OpenAI test failed.'}`;if(out)out.textContent=aiSetupMsg;}}

async function weeklyReview(){const out=document.getElementById('aires');const w=data.weeklyEntries[0];if(!w){if(out)out.textContent='No weekly entry available.';return;}if(out)out.textContent='Generating weekly review...';aiBusy=true;try{const prompt=`Weekly review for FinOS. Income: ${w.incomeAmount}, planned: ${w.plannedTotal}, allocated: ${w.allocatedTotal}, leftover: ${w.leftover}, shortfall: ${w.shortfall}, allocations: ${JSON.stringify(w.allocations)}. Return concise bullets: what went well, what is tight, what to improve, leftover suggestion, shortfall fix.`;const res=await callAI(prompt);w.aiSummary=res.text;saveSafe();if(out)out.textContent=res.text;}catch(e){if(out)out.textContent=e.message||'AI review failed.';}finally{aiBusy=false;}}

function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s;}
function dl(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
function stamp(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function expBackup(){dl(`finos-backup-${stamp()}.json`,JSON.stringify({cfg,data},null,2),'application/json');}
async function impBackup(e){const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j||typeof j!=='object')throw new Error('Invalid backup format');cfg=loadSafe('__tmp__',{...CFG0,...j.cfg});data=loadSafe('__tmp2__',{...DATA0,...j.data});localStorage.removeItem('__tmp__');localStorage.removeItem('__tmp2__');saveSafe();render();}catch(err){alert(`Import failed: ${err.message}`);}finally{e.target.value='';}}
function expWeeklyCSV(){const rows=['date,income,planned,allocated,leftover,shortfall,notes'];data.weeklyEntries.forEach(w=>rows.push([w.date,w.incomeAmount,w.plannedTotal,w.allocatedTotal,w.leftover,w.shortfall,csvCell(w.notes||'')].join(',')));dl(`weekly-entries-${stamp()}.csv`,rows.join('\n'),'text/csv');}
function expPlanCSV(){const rows=['name,type,priority,weeklyAmount,currentBalance,active,rollover'];cfg.buckets.forEach(b=>rows.push([csvCell(b.name),b.type,b.priority,b.weeklyAmount,b.currentBalance,b.active,b.rollover].join(',')));dl(`bucket-plan-${stamp()}.csv`,rows.join('\n'),'text/csv');}

window.addEventListener('error',(e)=>console.error('Renderer error:',e.message));
window.addEventListener('unhandledrejection',(e)=>console.error('Unhandled promise rejection:',e.reason));
const _render=render;render=function(){_render();bindViewEvents();};
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>FinOS</title>
<style>
:root{--bg:#06070b;--panel:#0f1117;--panel2:#151924;--line:rgba(255,255,255,.10);--text:#f7f9ff;--muted:#9ea8be;--violet:#494fdf;--ok:#00a87e;--warn:#ec7e00;--bad:#e23b4a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 700px at 25% -10%,#23285f 0%,#06070b 45%),#06070b;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
.app-shell{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:250px 1fr;gap:14px;min-height:100vh}.sidebar,.main{background:var(--panel);border:1px solid var(--line);border-radius:22px}.sidebar{padding:18px;display:flex;flex-direction:column;gap:12px}.brand{font-size:28px;font-weight:700}.sub{color:var(--muted);font-size:13px}
.nav button{width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--muted);padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:600}.nav button.active{color:#fff;background:rgba(73,79,223,.22);border-color:rgba(73,79,223,.55)}
.main{padding:18px;display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:end}.h1{font-size:32px;font-weight:700}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--panel2),#10131b);border:1px solid var(--line);border-radius:18px;padding:14px}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}.num{font-size:30px;font-weight:700}.small{font-size:13px;color:var(--muted)}
.bucket{border:1px solid var(--line);border-radius:14px;background:#0b0e15;padding:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.pill{font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:9999px;color:#dbe3ff}
.inp,textarea,select{width:100%;border:1px solid #d8dee8;background:#fff;color:#151922;border-radius:12px;padding:10px 12px;font-size:14px}.btn{border:0;border-radius:9999px;height:42px;padding:0 16px;font-weight:700;cursor:pointer}.btn-main{background:#fff;color:#000}.btn-v{background:var(--violet);color:#fff}
.stack>*{margin-bottom:10px}.stack>*:last-child{margin-bottom:0}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.chip-safe{border-color:#2d6}.chip-watch{border-color:#ec7e00}.chip-low,.chip-empty{border-color:#e23b4a}.chip-locked{border-color:#aaa}.chip-growing{border-color:#4f55f1}
.modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20}.modal{width:min(640px,95vw);max-height:90vh;overflow:auto}
@media (max-width:980px){.app-shell{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.nav button{text-align:center}}
</style></head><body><div id="app"></div><script>
'use strict';
const CFG_KEY='finos_cfg_v3',DATA_KEY='finos_data_v3';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),clone=v=>JSON.parse(JSON.stringify(v)),safeNum=v=>Number.isFinite(Number(v))?Number(v):0,esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

const BUCKET_DEFAULTS=[
  ['Rent','🏠','fixed',700,1,true,'accumulate',null,null,false],['Bills','⚡','fixed',180,2,true,'accumulate',null,null,false],['Groceries','🛒','flexible',150,3,false,'manual',null,null,true],['Spending','💳','flexible',120,9,false,'reset_weekly',null,null,true],['Emergency Fund','🛟','goal',80,4,true,'accumulate',null,null,false],['Debt Repayment','💸','debt',120,5,true,'accumulate',null,null,false],['Savings','💰','savings',90,6,false,'accumulate',null,null,false],['Goals / Trips','✈️','goal',70,8,false,'accumulate',null,null,false],['Subscriptions','📱','fixed',40,7,false,'accumulate',null,null,false],['Leftover / Buffer','🧱','buffer',0,99,false,'accumulate',null,null,false]
];
function mkBucket([name,icon,type,weeklyTarget,priority,locked,rolloverRule,rolloverCap,sweepTargetBucketId,includeInSafeToSpend]){return{id:uid(),name,icon,type,weeklyTarget,currentBalance:0,priority,active:true,locked,notes:'',rolloverRule,rolloverCap,sweepTargetBucketId,includeInSafeToSpend}}
const CFG0={onboardingDone:false,currency:'AUD',aiProvider:'openai',openaiApiKey:'',claudeApiKey:'',openaiModel:'gpt-4o-mini',claudeModel:'claude-sonnet-4-20250514',emergencyTarget:2000,totalDebt:40500,buckets:BUCKET_DEFAULTS.map(mkBucket),templates:{}};
const DATA0={weeklyEntries:[],transactions:[],aiHistory:[],activities:[],weeklyCloseouts:[],borrowRecords:[]};

function normalizeBucket(b){const map={emoji:'icon',weeklyAmount:'weeklyTarget'};const x={...b};for(const k in map){if(x[k]!==undefined&&x[map[k]]===undefined)x[map[k]]=x[k];}
 return {id:x.id||uid(),name:x.name||'Bucket',icon:x.icon||'📦',type:x.type||'flexible',weeklyTarget:safeNum(x.weeklyTarget),currentBalance:safeNum(x.currentBalance),priority:safeNum(x.priority||10),active:x.active!==false,locked:!!x.locked,notes:x.notes||'',rolloverRule:x.rolloverRule||'accumulate',rolloverCap:x.rolloverCap===null?null:safeNum(x.rolloverCap),sweepTargetBucketId:x.sweepTargetBucketId||null,includeInSafeToSpend:!!x.includeInSafeToSpend};}
function loadSafe(k,d){try{const r=localStorage.getItem(k);if(!r)return clone(d);return {...clone(d),...JSON.parse(r)};}catch{return clone(d)}}
let cfg=loadSafe(CFG_KEY,CFG0),data=loadSafe(DATA_KEY,DATA0);
cfg.buckets=(cfg.buckets||[]).map(normalizeBucket);['activities','weeklyCloseouts','borrowRecords','weeklyEntries','aiHistory','transactions'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});
function saveSafe(){localStorage.setItem(CFG_KEY,JSON.stringify(cfg));localStorage.setItem(DATA_KEY,JSON.stringify(data));}
const money=n=>{try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:cfg.currency||'AUD'}).format(safeNum(n));}catch{return '$'+safeNum(n).toFixed(2)}};
function addActivity(type,title,description,amount=0,sourceBucketId=null,destinationBucketId=null,metadata={}){data.activities.unshift({id:uid(),date:new Date().toISOString(),type,title,description,amount,sourceBucketId,destinationBucketId,metadata});}

function allocateIncome(incomeAmount,buckets){const income=Math.max(0,safeNum(incomeAmount));const active=buckets.filter(b=>b&&b.active!==false).sort((a,b)=>safeNum(a.priority)-safeNum(b.priority));const planned=active.filter(b=>b.type!=='buffer'&&b.name!=='Leftover / Buffer');let remaining=income;const allocations=[];const plannedTotal=planned.reduce((s,b)=>s+safeNum(b.weeklyTarget),0);for(const b of planned){const p=safeNum(b.weeklyTarget);let a=0,status='skipped';if(remaining>=p){a=p;status='funded'}else if(remaining>0){a=remaining;status='partial'}remaining=Math.max(0,remaining-a);allocations.push({bucketId:b.id,bucketName:b.name,plannedAmount:p,allocatedAmount:a,status});}return{plannedTotal,allocatedTotal:allocations.reduce((s,x)=>s+x.allocatedAmount,0),leftover:Math.max(0,remaining),shortfall:Math.max(0,plannedTotal-income),allocations};}
function daysLeftInWeek(){const d=new Date();const day=(d.getDay()+6)%7;return Math.max(1,7-day);} // Mon start
function safeToSpend(){const flex=cfg.buckets.filter(b=>b.active&&b.includeInSafeToSpend&&!b.locked).reduce((s,b)=>s+safeNum(b.currentBalance),0);const weekly=Math.max(0,flex);return{weekly,perDay:weekly/daysLeftInWeek(),days:daysLeftInWeek()};}
function getBucketHealth(b){if(b.locked)return'locked';const bal=safeNum(b.currentBalance),t=Math.max(1,safeNum(b.weeklyTarget));if(bal<=0)return'empty';if(['goal','savings','debt'].includes(b.type)&&bal>t)return'growing';if(b.type==='flexible'&&bal<t*.25)return'low';if(b.type==='flexible'&&bal<t*.5)return'watch';if(bal>t*1.7)return'overfunded';return'safe';}
function getSmartWarnings(){const w=[];const sp=cfg.buckets.find(b=>b.name==='Spending');const gr=cfg.buckets.find(b=>b.name==='Groceries');const buf=cfg.buckets.find(b=>/buffer/i.test(b.name));const rent=cfg.buckets.find(b=>b.name==='Rent');const bills=cfg.buckets.find(b=>b.name==='Bills');if(sp&&sp.currentBalance<=0&&daysLeftInWeek()>1)w.push('Spending is empty with days remaining.');if(gr&&gr.currentBalance<gr.weeklyTarget*.25)w.push('Groceries is below 25% of weekly target.');if(buf&&buf.currentBalance<=0)w.push('Buffer is $0. Consider sweeping leftover here first.');if(rent&&rent.currentBalance<rent.weeklyTarget)w.push('Rent is below weekly target.');if(bills&&bills.currentBalance<bills.weeklyTarget)w.push('Bills are below weekly target.');if(safeToSpend().weekly<=0)w.push('Safe-to-spend is currently $0.');if(data.borrowRecords.some(b=>b.status==='active'))w.push('There are active borrow records.');return w;}

function applyRolloverRules(){let sweptTotal=0;for(const b of cfg.buckets){if(b.rolloverRule==='reset_weekly'){if(b.currentBalance!==0){addActivity('reset',`Reset ${b.name}`,'Reset weekly bucket',b.currentBalance,b.id);b.currentBalance=0;}}else if(b.rolloverRule==='cap_and_sweep'&&b.rolloverCap!=null&&b.currentBalance>b.rolloverCap){const extra=b.currentBalance-b.rolloverCap;const tgt=cfg.buckets.find(x=>x.id===b.sweepTargetBucketId)||cfg.buckets.find(x=>/buffer/i.test(x.name));if(tgt){b.currentBalance-=extra;tgt.currentBalance+=extra;sweptTotal+=extra;addActivity('sweep',`Cap sweep from ${b.name}`,`Swept to ${tgt.name}`,extra,b.id,tgt.id);} }}
 return sweptTotal;}

let tab='dashboard',previewState=null,modal=null,closeoutNote='',historyFilter='all';
const TABS=[['dashboard','Overview'],['log','Log Income'],['plan','Money Plan'],['closeout','Weekly Closeout'],['history','History'],['ai','AI Coach'],['settings','Settings']];
function render(){const modalHtml=renderModal();app.innerHTML=`<div class='app-shell'><aside class='sidebar'><div><div class='brand'>FinOS</div><div class='sub'>Weekly Money OS</div></div><nav class='nav'>${TABS.map(([k,l])=>`<button class='${tab===k?'active':''}' data-tab='${k}'>${l}</button>`).join('')}</nav><div class='sub'>${money(safeToSpend().weekly)} safe this week</div></aside><main class='main'>${view()}</main></div>${modalHtml}`;bind();}
function view(){if(tab==='log')return logView();if(tab==='plan')return planView();if(tab==='history')return historyView();if(tab==='ai')return aiView();if(tab==='settings')return settingsView();if(tab==='closeout')return closeoutView();return dashboardView();}

function dashboardView(){const w=data.weeklyEntries[0],sts=safeToSpend(),warn=getSmartWarnings();return `<section class='top'><div><div class='h1'>Dashboard</div><div class='small'>Weekly operating view</div></div></section><section class='grid3'><div class='card'><div class='label'>Income</div><div class='num'>${money(w?.incomeAmount||0)}</div></div><div class='card'><div class='label'>Allocated</div><div class='num'>${money(w?.allocatedTotal||0)}</div></div><div class='card'><div class='label'>Leftover</div><div class='num ok'>${money(w?.leftover||0)}</div></div></section><section class='card'><div class='label'>Safe to Spend</div><div class='num'>${money(sts.weekly)}</div><div class='small'>${money(sts.perDay)}/day for ${sts.days} day(s). Money available in flexible buckets after protected buckets are excluded.</div></section><section class='card stack'><div class='label'>Smart warnings</div>${warn.length?warn.map(x=>`<div class='small warn'>• ${esc(x)}</div>`).join(''):'<div class="small ok">No warnings this week.</div>'}</section><section class='card'><div class='row'><div class='label'>Buckets</div><div><button class='btn btn-main' id='openSweep'>Sweep</button> <button class='btn btn-v' id='openCloseout'>Close Week</button></div></div><div class='grid2'>${cfg.buckets.map(b=>`<div class='bucket'><div class='row'><span>${esc(b.icon)} <b>${esc(b.name)}</b></span><span class='pill chip-${getBucketHealth(b)}'>${getBucketHealth(b)}</span></div><div><b>${money(b.currentBalance)}</b></div><div class='small'>Target ${money(b.weeklyTarget)} ${b.locked?'<span class="pill">Locked</span>':''}</div></div>`).join('')}</div></section><section class='card stack'><div class='label'>Active borrowing</div>${data.borrowRecords.filter(x=>x.status==='active').map(br=>{const s=cfg.buckets.find(b=>b.id===br.sourceBucketId)?.name||'source';const d=cfg.buckets.find(b=>b.id===br.destinationBucketId)?.name||'destination';return `<div class='small'>${money(br.amount-br.amountRepaid)} outstanding: ${esc(s)} → ${esc(d)}</div>`}).join('')||'<div class="small">None</div>'}</section>`;}
function logView(){return `<section class='top'><div><div class='h1'>Log Income</div><div class='small'>Primary weekly flow</div></div></section><section class='card stack'><input id='income' class='inp' type='number' placeholder='Weekly income amount'/><textarea id='notes' class='inp' style='height:88px' placeholder='Optional notes'></textarea><button class='btn btn-v' id='previewBtn'>Preview Allocation</button></section>${previewState?`<section class='card stack'>${previewState.allocations.map(a=>`<div class='bucket s-${a.status}'><div class='row'><b>${esc(a.bucketName)}</b><span class='pill'>${a.status}</span></div><div class='small'>${money(a.allocatedAmount)} / ${money(a.plannedAmount)}</div></div>`).join('')}<div class='small'>Leftover ${money(previewState.leftover)} · Shortfall ${money(previewState.shortfall)}</div><button class='btn btn-main' id='confirmBtn'>Confirm Week</button></section>`:''}`;}
function planView(){return `<section class='top'><div><div class='h1'>Money Plan</div><div class='small'>Rollover rules, locks, notes, safe-to-spend flags</div></div></section><section class='card stack'><div class='grid2'><div><label class='small'>Total Debt Target</label><input id='totalDebtInput' class='inp' type='number' value='${safeNum(cfg.totalDebt)}'/></div><div><label class='small'>Emergency Target</label><input id='emergencyTargetInput' class='inp' type='number' value='${safeNum(cfg.emergencyTarget)}'/></div></div></section><section class='card stack'>${cfg.buckets.map((b,i)=>`<div class='bucket stack'><div class='row'><span>${esc(b.icon)} <b>${esc(b.name)}</b></span><span class='pill chip-${getBucketHealth(b)}'>${getBucketHealth(b)}</span></div><div class='grid3'><input class='inp' data-b='${i}' data-k='weeklyTarget' type='number' value='${safeNum(b.weeklyTarget)}'/><input class='inp' data-b='${i}' data-k='priority' type='number' value='${safeNum(b.priority)}'/><select class='inp' data-b='${i}' data-k='rolloverRule'><option ${b.rolloverRule==='accumulate'?'selected':''}>accumulate</option><option ${b.rolloverRule==='reset_weekly'?'selected':''}>reset_weekly</option><option ${b.rolloverRule==='cap_and_sweep'?'selected':''}>cap_and_sweep</option><option ${b.rolloverRule==='manual'?'selected':''}>manual</option></select></div>${b.rolloverRule==='cap_and_sweep'?`<div class='grid2'><input class='inp' data-b='${i}' data-k='rolloverCap' type='number' value='${b.rolloverCap??0}'/><select class='inp' data-b='${i}' data-k='sweepTargetBucketId'><option value=''>Sweep target</option>${cfg.buckets.filter(x=>x.id!==b.id).map(x=>`<option value='${x.id}' ${x.id===b.sweepTargetBucketId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:''}<div class='row'><label class='small'><input type='checkbox' data-b='${i}' data-k='locked' ${b.locked?'checked':''}/> locked</label><label class='small'><input type='checkbox' data-b='${i}' data-k='includeInSafeToSpend' ${b.includeInSafeToSpend?'checked':''}/> include safe-to-spend</label></div><textarea class='inp' data-b='${i}' data-k='notes' style='height:56px' placeholder='notes'>${esc(b.notes||'')}</textarea></div>`).join('')}</section>`;}
function closeoutView(){const w=data.weeklyEntries[0]||{};const totalBal=cfg.buckets.reduce((s,b)=>s+b.currentBalance,0);const warn=getSmartWarnings();return `<section class='top'><div><div class='h1'>Weekly Closeout</div><div class='small'>Review and close current week</div></div></section><section class='grid3'><div class='card'><div class='label'>Income</div><div>${money(w.incomeAmount||0)}</div></div><div class='card'><div class='label'>Allocated</div><div>${money(w.allocatedTotal||0)}</div></div><div class='card'><div class='label'>Total Balances</div><div>${money(totalBal)}</div></div></section><section class='card stack'><div class='label'>Buckets</div>${cfg.buckets.map(b=>`<div class='row'><span>${esc(b.name)} <span class='small'>(${b.rolloverRule})</span></span><span>${money(b.currentBalance)} / ${money(b.weeklyTarget)}</span></div>`).join('')}</section><section class='card stack'><div class='label'>Suggested actions</div>${warn.map(x=>`<div class='small'>• ${esc(x)}</div>`).join('')||'<div class="small">No urgent actions.</div>'}<textarea id='closeoutNote' class='inp' style='height:76px' placeholder='Closeout note'>${esc(closeoutNote)}</textarea><div class='row'><button class='btn btn-main' id='previewCloseout'>Preview Closeout</button><button class='btn btn-v' id='closeWeekBtn'>Close Week</button></div></section>`;}
function historyView(){const rows=data.activities.filter(a=>historyFilter==='all'||a.type.includes(historyFilter));return `<section class='top'><div><div class='h1'>History</div><div class='small'>Activity feed</div></div></section><section class='card'><div class='row'>${['all','income','allocation','sweep','closeout','borrow','warning','note'].map(f=>`<button class='btn ${historyFilter===f?'btn-v':'btn-main'}' data-hf='${f}' style='height:34px'>${f}</button>`).join('')}</div></section><section class='card stack'>${rows.map(a=>`<div class='bucket'><div class='row'><b>${esc(a.title)}</b><span class='small'>${new Date(a.date).toLocaleString()}</span></div><div class='small'>${esc(a.description||'')}</div><div>${a.amount?money(a.amount):''} <span class='pill'>${a.type}</span></div></div>`).join('')||'<div class="small">No activity yet.</div>'}</section>`;}
function aiView(){const insights=[`Safe to spend: ${money(safeToSpend().weekly)} (${money(safeToSpend().perDay)}/day)`,...getSmartWarnings().map(w=>`Warning: ${w}`),...data.borrowRecords.filter(b=>b.status==='active').map(b=>`Borrow active: ${money(b.amount-b.amountRepaid)} outstanding`)];return `<section class='top'><div><div class='h1'>AI Coach</div><div class='small'>Rule-based practical insights + provider assist</div></div></section><section class='card stack'><div class='label'>Practical insights</div>${insights.map(i=>`<div class='small'>• ${esc(i)}</div>`).join('')}</section>`;}
function settingsView(){const templates={balanced:{spending:140,groceries:170,debt:130},survival:{spending:70,groceries:130,debt:80},aggressive:{spending:80,groceries:140,savings:160},debt:{spending:90,groceries:150,debt:220},low:{spending:60,groceries:120,debt:60}};return `<section class='top'><div><div class='h1'>Settings</div><div class='small'>AI + Templates</div></div></section><section class='card stack'><label class='label'>AI Provider</label><select id='aiProvider' class='inp'><option value='openai' ${cfg.aiProvider==='openai'?'selected':''}>OpenAI</option><option value='claude' ${cfg.aiProvider==='claude'?'selected':''}>Claude</option></select><input id='openaiKey' class='inp' value='${esc(cfg.openaiApiKey||'')}' placeholder='OpenAI key'/><input id='claudeKey' class='inp' value='${esc(cfg.claudeApiKey||'')}' placeholder='Claude key'/><button class='btn btn-v' id='saveSettingsBtn'>Save Settings</button></section><section class='card stack'><div class='label'>Templates</div>${Object.keys(templates).map(k=>`<button class='btn btn-main' data-tpl='${k}'>Apply ${k}</button>`).join('')}<button class='btn btn-main' id='saveCustomTpl'>Save Current Plan as Custom</button></section>`;}
function renderModal(){if(!modal)return'';if(modal.type==='sweep'){const opts=cfg.buckets.map(b=>`<option value='${b.id}'>${esc(b.name)}</option>`).join('');return `<div class='modalWrap'><div class='modal card stack'><div class='h1'>Sweep Money</div><select id='swSrc' class='inp'>${opts}</select><select id='swDst' class='inp'>${opts}</select><input id='swAmt' class='inp' type='number' placeholder='Amount'/><textarea id='swNote' class='inp' style='height:70px' placeholder='note'></textarea><div class='row'><button class='btn btn-main' id='cancelModal'>Cancel</button><button class='btn btn-v' id='doSweep'>Sweep</button></div></div></div>`;}
 if(modal.type==='onboarding'){const steps=[['Welcome to FinOS','FinOS helps you run money weekly: set plan once, log income weekly, auto-allocate, and close out week.'],['Money Plan','Set weekly targets and priorities. Lower priority number means funded earlier. Lock essential buckets like Rent/Bills.'],['Log Income','Enter this week is income, preview funded/partial/skipped buckets, then Confirm Week.'],['Safe to Spend','Dashboard shows flexible money left this week and per-day guidance.'],['Closeout & Sweep','Weekly Closeout applies rollover rules. Sweep moves money between buckets with activity logs.'],['AI Coach','Set API key in Settings, then use Quick Ask prompts for actionable guidance.']];const i=modal.step||0;const st=steps[i];return `<div class='modalWrap'><div class='modal card stack'><div class='h1'>${st[0]}</div><div class='small'>${st[1]}</div><div class='small'>Step ${i+1} of ${steps.length}</div><div class='row'><button class='btn btn-main' id='onbSkip'>Skip</button>${i>0?`<button class='btn btn-main' id='onbPrev'>Back</button>`:''}${i<steps.length-1?`<button class='btn btn-v' id='onbNext'>Next</button>`:`<button class='btn btn-v' id='onbDone'>Finish</button>`}</div></div></div>`;}
 if(modal.type==='borrow'){const opts=cfg.buckets.map(b=>`<option value='${b.id}'>${esc(b.name)}</option>`).join('');return `<div class='modalWrap'><div class='modal card stack'><div class='h1'>Borrow Money</div><select id='brSrc' class='inp'>${opts}</select><select id='brDst' class='inp'>${opts}</select><input id='brAmt' class='inp' type='number' placeholder='Amount'/><textarea id='brNote' class='inp' style='height:70px'></textarea><div class='row'><button class='btn btn-main' id='cancelModal'>Cancel</button><button class='btn btn-v' id='doBorrow'>Borrow</button></div></div></div>`;}
 return '';}

function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 const p=document.getElementById('previewBtn');if(p)p.onclick=()=>{const income=safeNum(document.getElementById('income').value);previewState={income,notes:document.getElementById('notes').value||'',...allocateIncome(income,cfg.buckets)};};
 const c=document.getElementById('confirmBtn');if(c)c.onclick=()=>{if(!previewState)return;const o=previewState;const entry={id:uid(),date:new Date().toISOString(),incomeAmount:o.income,plannedTotal:o.plannedTotal,allocatedTotal:o.allocatedTotal,leftover:o.leftover,shortfall:o.shortfall,allocations:o.allocations,notes:o.notes,aiSummary:''};data.weeklyEntries.unshift(entry);addActivity('income_logged','Income logged',`Income ${money(o.income)}`,o.income);addActivity('auto_allocation','Auto allocation',`Allocated ${money(o.allocatedTotal)}`,o.allocatedTotal);for(const a of o.allocations){const b=cfg.buckets.find(x=>x.id===a.bucketId);if(b)b.currentBalance+=safeNum(a.allocatedAmount);}const buffer=cfg.buckets.find(b=>/buffer/i.test(b.name));if(buffer&&o.leftover>0)buffer.currentBalance+=o.leftover;saveSafe();previewState=null;tab='dashboard';};
 document.querySelectorAll('[data-b]').forEach(el=>el.onchange=e=>{const i=safeNum(e.target.dataset.b),k=e.target.dataset.k,b=cfg.buckets[i];if(!b)return;b[k]=e.target.type==='checkbox'?!!e.target.checked:(k==='notes'?e.target.value:safeNum(e.target.value)||e.target.value);addActivity('bucket_updated',`Updated ${b.name}`,`${k} changed`);saveSafe();});
 const td=document.getElementById('totalDebtInput');if(td)td.onchange=e=>{cfg.totalDebt=safeNum(e.target.value);saveSafe();};const et=document.getElementById('emergencyTargetInput');if(et)et.onchange=e=>{cfg.emergencyTarget=safeNum(e.target.value);saveSafe();};
 const oc=document.getElementById('openCloseout');if(oc)oc.onclick=()=>{tab='closeout';render();};const os=document.getElementById('openSweep');if(os)os.onclick=()=>{modal={type:'sweep'};render();};
 const pc=document.getElementById('previewCloseout');if(pc)pc.onclick=()=>{closeoutNote=document.getElementById('closeoutNote').value;alert('Preview ready. Close Week will apply rollover rules.');};
 const cw=document.getElementById('closeWeekBtn');if(cw)cw.onclick=()=>{if(!confirm('Close this week now?'))return;closeoutNote=document.getElementById('closeoutNote').value;const sweptTotal=applyRolloverRules();const w=data.weeklyEntries[0]||{};const record={id:uid(),weekStartDate:new Date(Date.now()-6*86400000).toISOString().slice(0,10),weekEndDate:new Date().toISOString().slice(0,10),incomeTotal:safeNum(w.incomeAmount),allocatedTotal:safeNum(w.allocatedTotal),leftoverTotal:safeNum(w.leftover),sweptTotal,overspentBuckets:cfg.buckets.filter(b=>b.currentBalance<0).map(b=>b.id),bucketSnapshots:cfg.buckets.map(b=>({...b})),note:closeoutNote,createdAt:new Date().toISOString()};data.weeklyCloseouts.unshift(record);addActivity('closeout','Week closed','Weekly closeout completed',record.leftoverTotal);saveSafe();alert('Week closed successfully.');tab='dashboard';};
 document.querySelectorAll('[data-hf]').forEach(b=>b.onclick=()=>{historyFilter=b.dataset.hf;render();});
 const save=document.getElementById('saveSettingsBtn');if(save)save.onclick=()=>{cfg.aiProvider=document.getElementById('aiProvider').value;cfg.openaiApiKey=document.getElementById('openaiKey').value.trim();cfg.claudeApiKey=document.getElementById('claudeKey').value.trim();saveSafe();alert('Saved');};
 document.querySelectorAll('[data-tpl]').forEach(btn=>btn.onclick=()=>{const t=btn.dataset.tpl;const apply=(name,val)=>{const b=cfg.buckets.find(x=>x.name===name);if(b)b.weeklyTarget=val;};if(!confirm(`Apply template ${t}?`))return; if(t==='balanced'){apply('Spending',140);apply('Groceries',170);apply('Debt Repayment',130);} if(t==='survival'){apply('Spending',70);apply('Groceries',130);apply('Debt Repayment',80);} if(t==='aggressive'){apply('Spending',80);apply('Groceries',140);apply('Savings',160);} if(t==='debt'){apply('Spending',90);apply('Groceries',150);apply('Debt Repayment',220);} if(t==='low'){apply('Spending',60);apply('Groceries',120);apply('Debt Repayment',60);} addActivity('bucket_updated','Template applied',`Applied ${t}`);saveSafe();render();});
 const saveTpl=document.getElementById('saveCustomTpl');if(saveTpl)saveTpl.onclick=()=>{cfg.templates.custom=cfg.buckets.map(b=>({id:b.id,weeklyTarget:b.weeklyTarget,priority:b.priority,locked:b.locked,rolloverRule:b.rolloverRule,includeInSafeToSpend:b.includeInSafeToSpend}));saveSafe();alert('Custom template saved.');};
 const cancel=document.getElementById('cancelModal');if(cancel)cancel.onclick=()=>{modal=null;render();};
 
 const startGuide=document.getElementById('startGuide');if(startGuide)startGuide.onclick=()=>{modal={type:'onboarding',step:0};render();};
 const fresh=document.getElementById('freshStartBtn');if(fresh)fresh.onclick=()=>{if(!confirm('Fresh start will clear history, activities, borrow records, closeouts, AI history, and reset all bucket balances to $0. Continue?'))return;data.weeklyEntries=[];data.activities=[];data.weeklyCloseouts=[];data.borrowRecords=[];data.aiHistory=[];data.transactions=[];cfg.buckets=cfg.buckets.map(b=>({...b,currentBalance:0}));addActivity('reset','Fresh start','User cleared history and reset balances',0);saveSafe();tab='dashboard';render();};
 const onbSkip=document.getElementById('onbSkip');if(onbSkip)onbSkip.onclick=()=>{cfg.onboardingDone=true;modal=null;saveSafe();render();};
 const onbPrev=document.getElementById('onbPrev');if(onbPrev)onbPrev.onclick=()=>{modal.step=Math.max(0,(modal.step||0)-1);render();};
 const onbNext=document.getElementById('onbNext');if(onbNext)onbNext.onclick=()=>{modal.step=(modal.step||0)+1;render();};
 const onbDone=document.getElementById('onbDone');if(onbDone)onbDone.onclick=()=>{cfg.onboardingDone=true;modal=null;saveSafe();render();};

 const doSweep=document.getElementById('doSweep');if(doSweep)doSweep.onclick=()=>{const s=cfg.buckets.find(b=>b.id===document.getElementById('swSrc').value),d=cfg.buckets.find(b=>b.id===document.getElementById('swDst').value),amt=safeNum(document.getElementById('swAmt').value),note=document.getElementById('swNote').value;if(!s||!d||amt<=0||amt>s.currentBalance)return alert('Invalid sweep amount/source.');if(s.locked&&!confirm('This bucket is locked because it protects an important commitment. Are you sure you want to move money out?'))return;s.currentBalance-=amt;d.currentBalance+=amt;addActivity('sweep',`Sweep ${s.name} → ${d.name}`,note||'Sweep transfer',amt,s.id,d.id);modal=null;saveSafe();render();};
 const doBorrow=document.getElementById('doBorrow');if(doBorrow)doBorrow.onclick=()=>{const s=cfg.buckets.find(b=>b.id===document.getElementById('brSrc').value),d=cfg.buckets.find(b=>b.id===document.getElementById('brDst').value),amt=safeNum(document.getElementById('brAmt').value),note=document.getElementById('brNote').value;if(!s||!d||amt<=0||amt>s.currentBalance)return alert('Invalid borrow amount/source.');if(s.locked&&!confirm('This bucket is locked because it protects an important commitment. Are you sure you want to move money out?'))return;s.currentBalance-=amt;d.currentBalance+=amt;data.borrowRecords.unshift({id:uid(),sourceBucketId:s.id,destinationBucketId:d.id,amount:amt,amountRepaid:0,status:'active',createdAt:new Date().toISOString(),note});addActivity('borrow',`Borrow ${s.name} → ${d.name}`,note||'Borrow transfer',amt,s.id,d.id);modal=null;saveSafe();render();};
}

window.addEventListener('error',e=>console.error('Renderer error:',e.message));window.addEventListener('unhandledrejection',e=>console.error('Unhandled promise rejection:',e.reason));
if(!window.finosAPI){window.finosAPI={aiMessage:async()=>({success:false,error:'AI unavailable in browser preview'}),getAIProviders:async()=>({success:true,providers:['openai','claude']}),appInfo:async()=>({name:'FinOS (Web Preview)',version:'preview',platform:'browser',electron:'N/A'})};}
const app=document.getElementById('app');if(!cfg.onboardingDone)modal={type:'onboarding',step:0};render();
</script></body></html>
